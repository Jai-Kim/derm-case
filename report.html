<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DermCase — Clinical Literature Brief</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#14130D; --ink-2:#68655C; --ink-3:#9C9990;
  --paper:#F4F2EC; --surface:#FFFFFF; --border:#E3E0D8; --border-2:#D2CEC3;
  --green:#1A6640; --forest:#0A2E1E;
  --r:14px; --r-sm:9px;
}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;padding:2rem 1rem 4rem}
.mono{font-family:'DM Mono',monospace}
.container{max-width:720px;margin:0 auto}

.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:1.25rem}
.back-link{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);text-decoration:none}
.back-link:hover{color:var(--ink)}
.pdf-btn{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:#fff;background:var(--green);border:none;border-radius:10px;padding:8px 15px;cursor:pointer;transition:background .15s}
.pdf-btn:hover{background:#15532f}

.report-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding-bottom:1rem;border-bottom:1.5px solid var(--border);margin-bottom:1.25rem}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--green);display:grid;place-items:center;flex-shrink:0}
.brand h1{font-size:17px;font-weight:600;letter-spacing:-.01em}
.brand .sub{font-size:12px;color:var(--ink-2);margin-top:2px}
.gen{font-size:11px;color:var(--ink-3);text-align:right;font-family:'DM Mono',monospace;white-space:nowrap}

.meta-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:.95rem 1.2rem;margin-bottom:1rem;display:flex;flex-wrap:wrap;gap:11px 26px}
.meta-item{display:flex;flex-direction:column;gap:2px}
.meta-label{font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.meta-value{font-size:14px;color:var(--ink);font-weight:500}

.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.1rem 1.25rem;margin-bottom:1rem}
.section-title{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:13px}

.assess-item{background:var(--paper);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:9px}
.assess-item:last-child{margin-bottom:0}
.assess-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px}
.assess-name{font-size:15px;font-weight:600}
.icd{font-family:'DM Mono',monospace;font-size:11px;background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:2px 7px}
.assess-rationale{font-size:13px;color:var(--ink-2);line-height:1.6}

.tx-rationale{font-size:12.5px;color:var(--ink-2);line-height:1.6;margin-bottom:12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:var(--paper);border-radius:var(--r-sm);padding:13px}
.opt-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px}
.opt-name{font-size:14px;font-weight:600}
.axis{margin-top:8px}
.axis-label{font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.axis-val{font-size:12.5px;color:var(--ink);line-height:1.45;margin-top:1px}
.opt-source{font-size:10.5px;color:var(--green);font-family:'DM Mono',monospace;margin-top:9px}

.ref{padding:11px 0;border-bottom:1px solid var(--border)}
.ref:first-child{padding-top:0}
.ref:last-child{border-bottom:none;padding-bottom:0}
.ref-title{font-size:13px;font-weight:600;margin:4px 0 2px}
.ref-rel{font-size:12.5px;color:var(--ink-2);line-height:1.55}
.ref-source{font-size:11px;color:var(--green);font-family:'DM Mono',monospace;margin-top:4px}

.evp{display:inline-block;font-size:10px;font-weight:500;padding:2px 8px;border-radius:99px;line-height:1.5}
.evp-s{background:#E1F5EE;color:#0F6E56} .evp-m{background:#E7EFFA;color:#2A5C95} .evp-w{background:#F7ECDA;color:#9A5B12}

.tx-note,.disclaimer{font-size:11px;color:var(--ink-3);line-height:1.6}
.tx-note{margin-top:11px}
.disclaimer{padding:11px 13px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);margin-top:.25rem}
.error{padding:2.5rem 1rem;text-align:center;color:var(--ink-2);font-size:14px;line-height:1.7}

@media (max-width:540px){ .opts{grid-template-columns:1fr} }

@media print{
  @page{margin:15mm}
  body{background:#fff;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .no-print{display:none!important}
  .container{max-width:none}
  .meta-card,.section{border-color:#d8d5cc;box-shadow:none}
  .section,.assess-item,.opt,.ref{break-inside:avoid}
  .section{margin-bottom:.6rem;page-break-inside:avoid}
  .evp{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="container">
  <div class="toolbar no-print">
    <a class="back-link" href="/app">
      <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M9 2L4 7l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="backTxt">Back to DermCase</span>
    </a>
    <button class="pdf-btn" id="pdfBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 3v11m0 0l-4-4m4 4l4-4M5 19h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="pdfTxt">Save as PDF</span>
    </button>
  </div>
  <div id="content"><div class="error">Loading brief…</div></div>
</div>
<script>
const L = {
  en: {
    title:'Clinical Literature Brief', sub:'AI-assisted · de-identified · for physician review',
    back:'Back to DermCase', pdf:'Save as PDF', generated:'Generated',
    mAge:'Age', mSex:'Sex', mArea:'Affected area', mDuration:'Duration', mFitz:'Skin type',
    sAssess:'Clinical assessment', sTx:'Treatment options', sLit:'Literature',
    axEff:'Efficacy', axOns:'Onset', axMon:'Monitoring', axKey:'Key consideration',
    txNote:'Literature-derived options for physician consideration — not a prescribing recommendation.',
    disc:'For clinical decision support only — not a substitute for physician judgment. Validate all findings against current guidelines and patient-specific factors.',
    invalid:'This brief link is invalid or has expired.',
    ev:{'guideline':['s','Guideline'],'meta-analysis':['s','Meta-analysis'],'rct':['s','RCT'],'cohort':['m','Cohort'],'review':['m','Review'],'case-report':['w','Case report']},
    sex:{'Male':'Male','Female':'Female','Other':'Other'}
  },
  ko: {
    title:'임상 문헌 브리프', sub:'AI 보조 · 비식별 · 의사 검토용',
    back:'DermCase 앱으로', pdf:'PDF로 저장', generated:'생성일',
    mAge:'나이', mSex:'성별', mArea:'발생 부위', mDuration:'기간', mFitz:'피부 유형',
    sAssess:'임상 평가', sTx:'치료 옵션', sLit:'관련 문헌',
    axEff:'효능', axOns:'발현 시기', axMon:'모니터링', axKey:'핵심 고려사항',
    txNote:'의사 검토용 문헌 기반 옵션 — 처방 권고가 아닙니다.',
    disc:'임상 의사결정 지원 목적으로만 사용 — 의사 판단을 대체하지 않습니다. 모든 결과는 현재 가이드라인 및 환자별 요인에 따라 검증하십시오.',
    invalid:'유효하지 않거나 만료된 브리프 링크입니다.',
    ev:{'guideline':['s','가이드라인'],'meta-analysis':['s','메타분석'],'rct':['s','RCT'],'cohort':['m','코호트'],'review':['m','리뷰'],'case-report':['w','증례 보고']},
    sex:{'Male':'남성','Female':'여성','Other':'기타'}
  }
};
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function safeUrl(u){u=(u||'').trim();return /^https?:\/\/[^\s"'<>]+$/i.test(u)?u:'';}
function pubmed(title){return 'https://pubmed.ncbi.nlm.nih.gov/?term='+encodeURIComponent(String(title||'').replace(/[^\w\s().-]/g,' ').trim());}

function render(data, lang){
  const t = L[lang] || L.en;
  const result = data.result || {}, meta = data.meta || {};
  const assessment = result.assessment || [], refs = result.references || [], tc = result.treatment_comparison;
  document.documentElement.lang = lang;
  document.getElementById('backTxt').textContent = t.back;
  document.getElementById('pdfTxt').textContent = t.pdf;

  const sexVal = meta.sex ? (t.sex[meta.sex] || meta.sex) : '';
  const metaFields = [
    meta.age && {l:t.mAge, v:meta.age},
    sexVal && {l:t.mSex, v:sexVal},
    meta.area && {l:t.mArea, v:meta.area},
    meta.duration && {l:t.mDuration, v:meta.duration},
    meta.fitz && {l:t.mFitz, v:'Fitzpatrick '+meta.fitz}
  ].filter(Boolean);
  const metaHtml = metaFields.length ? `<div class="meta-card">${metaFields.map(f=>`<div class="meta-item"><span class="meta-label">${esc(f.l)}</span><span class="meta-value">${esc(f.v)}</span></div>`).join('')}</div>` : '';

  const pill = lvl => { const e = t.ev[lvl]; return e ? `<span class="evp evp-${e[0]}">${esc(e[1])}</span>` : ''; };

  const assessHtml = assessment.map(a=>`<div class="assess-item"><div class="assess-top"><span class="assess-name">${esc(a.diagnosis)}</span>${a.icd10?`<span class="icd">ICD-10 · ${esc(a.icd10)}</span>`:''}</div><div class="assess-rationale">${esc(a.rationale)}</div></div>`).join('');

  let txHtml = '';
  if(tc && Array.isArray(tc.options) && tc.options.length){
    const axes = [['efficacy',t.axEff],['onset',t.axOns],['monitoring',t.axMon],['key_consideration',t.axKey]];
    const cards = tc.options.map(o=>{
      const rows = axes.filter(([k])=>o[k]).map(([k,lbl])=>`<div class="axis"><div class="axis-label">${esc(lbl)}</div><div class="axis-val">${esc(o[k])}</div></div>`).join('');
      return `<div class="opt"><div class="opt-top"><span class="opt-name">${esc(o.name)}</span>${pill(o.evidence_level)}</div>${rows}${o.source?`<div class="opt-source"><a href="${safeUrl(o.url)||pubmed(o.name+' '+o.source)}" target="_blank" rel="noopener noreferrer" style="color:var(--green);text-decoration:none">${esc(o.source)} ↗</a></div>`:''}</div>`;
    }).join('');
    txHtml = `<div class="section"><div class="section-title">${t.sTx}</div>${tc.rationale?`<div class="tx-rationale">${esc(tc.rationale)}</div>`:''}<div class="opts">${cards}</div><div class="tx-note">${t.txNote}</div></div>`;
  }

  const refHtml = refs.map(function(r){var direct=safeUrl(r.url);var href=direct||pubmed(r.title);var shown=direct||pubmed(r.title);return `<div class="ref">${pill(r.evidence_level)}<a class="ref-title" href="${href}" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:none">${esc(r.title)} ↗</a><div class="ref-rel">${esc(r.relevance)}</div><div class="ref-source">${esc(r.source)} · <a href="${href}" target="_blank" rel="noopener noreferrer" style="color:var(--green);word-break:break-all">${esc(shown)}</a></div></div>`;}).join('');

  const dateStr = new Date(meta.sharedAt || Date.now()).toLocaleDateString(lang==='ko'?'ko-KR':'en-US',{year:'numeric',month:'short',day:'numeric'});

  document.getElementById('content').innerHTML = `
    <div class="report-header">
      <div class="brand">
        <span class="logo"><svg width="19" height="19" viewBox="0 0 16 16" fill="none"><path d="M8 2.3L13.2 5v6L8 13.7 2.8 11V5L8 2.3z" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/></svg></span>
        <div><h1>${t.title}</h1><div class="sub">${t.sub}</div></div>
      </div>
      <div class="gen">${t.generated}<br>${dateStr}</div>
    </div>
    ${metaHtml}
    ${assessHtml?`<div class="section"><div class="section-title">${t.sAssess}</div>${assessHtml}</div>`:''}
    ${txHtml}
    ${refHtml?`<div class="section"><div class="section-title">${t.sLit}</div>${refHtml}</div>`:''}
    <div class="disclaimer">${t.disc}</div>`;
}

(function(){
  let lang = 'en';
  try{
    const hash = window.location.hash.slice(1);
    if(!hash) throw new Error('no data');
    const data = JSON.parse(decodeURIComponent(escape(atob(hash))));
    lang = (data.lang === 'ko' || data.lang === 'en') ? data.lang : 'en';
    render(data, lang);
    document.getElementById('pdfBtn').addEventListener('click', ()=>window.print());
    if(new URLSearchParams(location.search).get('print')==='1'){ setTimeout(()=>window.print(), 450); }
  }catch(e){
    const t = L[lang] || L.en;
    document.getElementById('content').innerHTML = `<div class="error">${t.invalid}<br><br><a class="back-link" href="/app">← ${t.back}</a></div>`;
  }
})();
</script>
</body>
</html>
