<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DermCase</title>
<meta name="theme-color" content="#F4F5F3">
<link rel="icon" type="image/svg+xml" href="/assets/darae-ink.svg">
<link rel="apple-touch-icon" href="/assets/favicon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0C0E11" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DermCase">
<link rel="stylesheet" href="/assets/fonts/pretendard-1.3.9/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="/assets/ds.css">
<script src="/assets/ds.js"></script>
<script src="/assets/vendor/supabase-js-2.117.1.min.js"></script>
<script src="/config.js"></script>
<script src="/dermcase-cloud.js"></script>
<script src="/assets/pwa.js" defer></script>
</head>
<body data-install>
<div class="spectrum" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
<header class="nav">
  <div class="wrap wide nav-in">
    <a class="brand" href="/"><img class="mark mark-ink" src="/assets/darae-ink.svg" alt="" width="26" height="26"><span>DermCase</span></a>
    <nav class="nav-links" aria-label="Main">
      <span id="authSlot" style="display:contents"></span>
      <a class="nav-link" href="/about" data-i18n="navAbout"></a>
      <button class="icon-btn" type="button" data-theme-toggle aria-label="Toggle theme">
        <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </nav>
  </div>
</header>

<main class="wrap wide work">
  <aside class="case" aria-label="Case">
    <div class="case-sec">
      <div class="case-head"><h2 data-i18n="caseTitle"></h2><button type="button" id="sampleBtn" class="link" data-i18n="trySample"></button></div>
      <div class="bed" id="dropZone">
        <input type="file" id="fileInput" accept="image/*" multiple class="hide" aria-label="Case photos">
        <button type="button" class="bed-prompt" id="uploadPrompt">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="26" height="19" rx="3.5"/><circle cx="16" cy="17.5" r="5"/><path d="M11 8l1.6-3h6.8L21 8"/></svg>
          <span class="t1" data-i18n="uploadText"></span>
          <span class="t2" data-i18n="uploadSub"></span>
        </button>
        <div class="bed-load" id="uploadLoading"><span class="spin"></span><span data-i18n="optimizing"></span></div>
        <div class="thumbs" id="thumbGrid" style="display:none"></div>
      </div>
    </div>
    <div class="case-sec">
      <div class="grid2">
        <div class="field"><label for="age" data-i18n="age"></label><input class="input" type="number" id="age" inputmode="numeric" min="0" max="120" data-i18n-placeholder="agePh"></div>
        <div class="field"><label for="sex" data-i18n="sex"></label><div class="select-wrap"><select class="select" id="sex">
          <option value="" data-i18n="sexSelect"></option><option value="Male" data-i18n="sexMale"></option><option value="Female" data-i18n="sexFemale"></option><option value="Other" data-i18n="sexOther"></option>
        </select></div></div>
        <div class="field span2"><label for="area" data-i18n="area"></label><input class="input" type="text" id="area" maxlength="120" data-i18n-placeholder="areaPh"></div>
        <div class="field"><label for="duration" data-i18n="duration"></label><input class="input" type="text" id="duration" maxlength="120" data-i18n-placeholder="durationPh"></div>
        <div class="field"><label for="lang" data-i18n="reportLang"></label><div class="select-wrap"><select class="select" id="lang"><option value="ko">한국어</option><option value="en">English</option></select></div></div>
        <div class="field span2">
          <span class="lbl" id="fitzLbl" data-i18n="fitzLabel"></span>
          <div class="fitz" id="fitzPicker" role="group" aria-labelledby="fitzLbl">
            <button type="button" class="fitz-chip" data-fitz="I" aria-pressed="false">I</button>
            <button type="button" class="fitz-chip" data-fitz="II" aria-pressed="false">II</button>
            <button type="button" class="fitz-chip" data-fitz="III" aria-pressed="false">III</button>
            <button type="button" class="fitz-chip" data-fitz="IV" aria-pressed="false">IV</button>
            <button type="button" class="fitz-chip" data-fitz="V" aria-pressed="false">V</button>
            <button type="button" class="fitz-chip" data-fitz="VI" aria-pressed="false">VI</button>
          </div>
          <div id="fitzDesc" class="fitz-desc"></div>
        </div>
        <div class="field span2"><label for="notes" data-i18n="notes"></label><textarea class="textarea" id="notes" maxlength="1500" data-i18n-placeholder="notesPh"></textarea></div>
      </div>
    </div>
    <div class="case-sec act">
      <button class="btn btn-solid btn-block" id="analyzeBtn" type="button" disabled data-i18n="analyzeBtn"></button>
      <p class="fine send-note"><span data-i18n="sendNote"></span> <a class="link" href="/privacy" data-i18n="privacyLink"></a></p>
      <p class="fine" style="margin-top:12px" data-i18n="deid"></p>
    </div>
  </aside>

  <section class="out" aria-label="Brief">
    <div id="status" class="sr" role="status"></div>
    <div id="emptyState" class="empty">
      <h2 data-i18n="emptyTitle"></h2>
      <p data-i18n="emptyBody"></p>
      <button class="btn btn-line" id="emptyExample" type="button" style="margin-top:20px" data-i18n="seeExample"></button>
      <div class="ghost" aria-hidden="true">
        <div><i class="s"></i><i class="l"></i><i class="m"></i></div>
        <div><i class="s"></i><i class="l"></i><i class="l"></i><i class="m"></i></div>
      </div>
    </div>
    <div id="outputArea"></div>
    <div id="historyArea"></div>
    <p class="page-foot" data-i18n="disclaimer"></p>
    <p class="page-foot"><a class="link" href="/privacy" data-i18n="privacyLink"></a></p>
  </section>
</main>

<script src="/assets/safe.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/assets/js/app-history.js"></script>
<script src="/assets/js/app-auth.js"></script>
<script src="/assets/js/analytics.js" defer></script>
</body>
</html>
