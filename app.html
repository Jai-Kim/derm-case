<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

  --b2: 45 27% 94%;
  --b3: 44 16% 87%;

  --inc: 0 0% 100%;

  --wac: 0 0% 100%;
  --er: 0 65% 29%;
  --erc: 0 0% 100%;
--color-primary: #1A6640;
  --color-primary-content: #FFFFFF;
  --color-secondary: #0A2E1E;
  --color-base-100: #FBFAF6;
  --color-base-200: #F4F2EC;
  --color-base-300: #E3E0D8;

}
body { font-family: 'DM Sans', sans-serif; background: #F4F2EC; -webkit-font-smoothing: antialiased; }

<style>
@keyframes pageEnter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.page-enter { animation: pageEnter .5s cubic-bezier(.22,1,.36,1) both; }
@media (prefers-reduced-motion: reduce) { .page-enter { animation: none; } }
.evp{display:inline-block;font-size:10.5px;font-weight:500;padding:2px 9px;border-radius:99px;line-height:1.45}
.evp-s{background:#E1F5EE;color:#0F6E56}
.evp-m{background:#E7EFFA;color:#2A5C95}
.evp-w{background:#F7ECDA;color:#9A5B12}
.fitz-chip{position:relative;width:40px;height:34px;border-radius:9px;border:1.5px solid var(--color-base-300);font-family:'DM Mono',monospace;font-size:12px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .12s,border-color .15s,box-shadow .15s}
.fitz-chip:hover{transform:translateY(-1px)}
.fitz-chip.sel{border-color:var(--color-primary);box-shadow:0 0 0 2px rgba(26,102,64,.28)}
</style>
</head>
<body data-theme="dermcase">
<div class="green-accent-bar" style="height:3px;background:linear-gradient(90deg,#4E9E73,#1A6640,#0A2E1E)"></div>
<nav class="sticky top-0 z-30 backdrop-blur bg-base-200/80 border-b border-base-300">
  <div class="max-w-[1100px] mx-auto px-4 h-14 flex items-center justify-between">
    <a href="/" class="flex items-center gap-2.5 group">

        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 2.5L13 5v6l-5 2.5L3 11V5l5-2.5z" stroke="white" stroke-width="1.3" stroke-linejoin="round"/></svg>

      <a href="/about" class="px-3 py-1.5 rounded-lg text-base-content/70 hover:text-base-content hover:bg-base-300/60 transition" data-i18n="navAbout"></a>
      <a href="/" class="px-3 py-1.5 rounded-lg text-base-content/70 hover:text-base-content hover:bg-base-300/60 transition" data-i18n="navHome"></a>
    </div>
  </div>
</nav>
<div class="max-w-[700px] mx-auto px-4 py-6 pb-12 page-enter">

const SAMPLE_CASE = {
  age: '47', sex: 'Female', area: 'Bilateral shins and elbows',
  duration: '8 months, worsening', fitz: 'III',
  notes: 'Well-demarcated erythematous plaques with thick silvery scale. Failed 3 months of high-potency topical corticosteroids and vitamin D analog. History of mild hypertension. Patient asks about systemic options. Fitzpatrick III.'
};
let currentLang = 'ko';
function t(key) { return I18N[currentLang][key] || I18N.en[key] || key; }
function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.innerHTML = t(el.getAttribute('data-i18n'));
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    el.placeholder = t(el.getAttribute('data-i18n-placeholder'));
  });
  const sex = document.getElementById('sex');
  if (sex) {
    const keys = ['sexSelect','sexMale','sexFemale','sexOther'];
    Array.from(sex.options).forEach((opt, i) => { if (keys[i]) opt.text = t(keys[i]); });
  }
}

let images = []; const MAX_IMAGES = 3;
const dropZone=document.getElementById('dropZone'),fileInput=document.getElementById('fileInput'),uploadPrompt=document.getElementById('uploadPrompt'),uploadLoading=document.getElementById('uploadLoading'),thumbGrid=document.getElementById('thumbGrid'),analyzeBtn=document.getElementById('analyzeBtn'),outputArea=document.getElementById('outputArea');

function processFile(file){
  return new Promise((resolve,reject)=>{
    if(!file||!file.type.startsWith('image/')){reject();return;}
    const img=new Image();const url=URL.createObjectURL(file);
    img.onload=()=>{URL.revokeObjectURL(url);const MAX=1200;let w=img.width,h=img.height;if(w>MAX||h>MAX){const s=Math.min(MAX/w,MAX/h);w=Math.round(w*s);h=Math.round(h*s);}const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);const dataUrl=cv.toDataURL('image/jpeg',0.82);resolve({base64:dataUrl.split(',')[1],mime:'image/jpeg',dataUrl});};
    img.onerror=()=>{URL.revokeObjectURL(url);reject();};
    img.src=url;
  });
}
async function loadImages(fileList){
  const files=Array.from(fileList||[]).filter(f=>f.type&&f.type.startsWith('image/'));
  const room=MAX_IMAGES-images.length;
  if(!files.length||room<=0)return;
  uploadPrompt.style.display='none';thumbGrid.style.display='none';uploadLoading.style.display='flex';
  for(const f of files.slice(0,room)){try{const im=await processFile(f);images.push(im);}catch(e){}}
  uploadLoading.style.display='none';
  renderThumbs();updateBtn();
}
function renderThumbs(){
  if(!images.length){uploadPrompt.style.display='block';thumbGrid.style.display='none';thumbGrid.innerHTML='';return;}
  uploadPrompt.style.display='none';thumbGrid.style.display='flex';
  const tiles=images.map((im,i)=>`<div class="relative"><img src="${im.dataUrl}" class="w-[88px] h-[88px] object-cover rounded-lg border border-base-300"><button data-rm="${i}" type="button" class="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-base-100 border border-base-300 text-base-content/60 text-[10px] flex items-center justify-center hover:bg-base-300 hover:text-base-content">✕</button></div>`).join('');
  const add=images.length<MAX_IMAGES?`<button id="addTile" type="button" class="w-[88px] h-[88px] rounded-lg border-[1.5px] border-dashed border-base-300 text-base-content/40 hover:border-primary hover:text-primary flex items-center justify-center text-2xl leading-none">+</button>`:'';
  thumbGrid.innerHTML=tiles+add;
  thumbGrid.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();removeImage(parseInt(b.getAttribute('data-rm'),10));}));
  const at=document.getElementById('addTile');if(at)at.addEventListener('click',()=>fileInput.click());
}
function removeImage(i){images.splice(i,1);renderThumbs();updateBtn();}
function resetImages(){images=[];fileInput.value='';renderThumbs();updateBtn();}
function updateBtn(){analyzeBtn.disabled=images.length===0;}

document.addEventListener('DOMContentLoaded', () => { applyI18n(); });
document.getElementById('lang').addEventListener('change', e => { currentLang = e.target.value; applyI18n(); if(window.__renderAuth) window.__renderAuth(); if(window.__renderFitz) window.__renderFitz(); });
document.getElementById('sampleBtn').addEventListener('click', () => {
  document.getElementById('age').value = SAMPLE_CASE.age;
  document.getElementById('sex').value = SAMPLE_CASE.sex;
  document.getElementById('area').value = SAMPLE_CASE.area;
  document.getElementById('duration').value = SAMPLE_CASE.duration;
  document.getElementById('notes').value = SAMPLE_CASE.notes;
  fitz = SAMPLE_CASE.fitz || ''; renderFitz();
  const b = document.getElementById('sampleBtn');
  const orig = t('trySample');
  b.textContent = t('sampleLoaded');
  setTimeout(() => { b.textContent = orig; }, 2600);
});

// Fitzpatrick skin-type picker
let fitz = '';
const fitzDescEl = document.getElementById('fitzDesc');
function renderFitz(){
  document.querySelectorAll('.fitz-chip').forEach(function(ch){ ch.classList.toggle('sel', ch.getAttribute('data-fitz') === fitz); });
  if(fitzDescEl) fitzDescEl.textContent = fitz ? (fitz + ' · ' + t('fitz'+fitz)) : '';
}
function setFitz(v){ fitz = (fitz === v ? '' : v); renderFitz(); }
window.__renderFitz = renderFitz;
document.querySelectorAll('.fitz-chip').forEach(function(ch){
  var v = ch.getAttribute('data-fitz');
  ch.addEventListener('click', function(){ setFitz(v); });
  ch.addEventListener('mouseenter', function(){ if(!fitz && fitzDescEl) fitzDescEl.textContent = v + ' · ' + t('fitz'+v); });
  ch.addEventListener('mouseleave', function(){ if(!fitz && fitzDescEl) fitzDescEl.textContent = ''; });
});
uploadPrompt.addEventListener('click',()=>fileInput.click());
fileInput.addEventListener('change',e=>{loadImages(e.target.files);fileInput.value='';});
dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.classList.add('border-primary','bg-primary/5');});
dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('border-primary','bg-primary/5'));
dropZone.addEventListener('drop',e=>{e.preventDefault();dropZone.classList.remove('border-primary','bg-primary/5');loadImages(e.dataTransfer.files);});
updateBtn();
analyzeBtn.addEventListener('click',runAnalysis);

function showProgress(){
  outputArea.innerHTML=`<div class="alert bg-base-100 border border-base-300 mt-3 py-3.5 rounded-2xl"><span class="loading loading-spinner loading-sm text-primary"></span><span class="text-[13px] text-base-content/70">${t('analyzing')}</span></div>`;
}

async function runAnalysis(){
  const age=document.getElementById('age').value.trim(),sex=document.getElementById('sex').value,area=document.getElementById('area').value.trim(),duration=document.getElementById('duration').value.trim(),notes=document.getElementById('notes').value.trim(),lang=document.getElementById('lang').value;currentLang=lang;
  const ctx=[age&&`Age: ${age}`,sex&&`Sex: ${sex}`,area&&`Affected area: ${area}`,duration&&`Duration: ${duration}`,fitz&&`Fitzpatrick skin type: ${fitz}`,notes&&`Notes: ${notes}`].filter(Boolean).join('\n')||'No patient context provided.';
  const langInstruction=lang==='ko'?'IMPORTANT: Write ALL text in your JSON response in Korean (한국어). This includes diagnosis names, rationale, and reference relevance text. Only keep source citations and DOIs in their original language.':'Write all response text in English.';
  analyzeBtn.disabled=true;showProgress();
  const sys=`You are a clinical literature assistant for practicing dermatologists. Analyze the case photo and patient context. Return ONLY a valid JSON object — no markdown fences, no preamble, nothing outside the JSON.

${langInstruction}

{
  "relevant": true,
  "rejection": { "reason": "If relevant is false: one friendly sentence on why this image cannot be assessed", "detected": "If relevant is false: a few words on what the image appears to show" },
  "assessment": [
    { "diagnosis": "Diagnosis name", "icd10": "L40.0", "rationale": "1-2 sentence clinical rationale based on visible morphology and patient context" }
  ],
  "references": [
    { "title": "Paper or guideline title", "relevance": "1-2 sentences on direct applicability to this specific case", "source": "Journal, year", "url": "Direct link from your search — DOI (https://doi.org/...) or PubMed (https://pubmed.ncbi.nlm.nih.gov/...); empty string if you have no reliable link", "evidence_level": "guideline" }
  ],
  "treatment_comparison": {
    "rationale": "1 sentence on why these specific options are in contention for THIS patient",
    "options": [
      { "name": "Treatment name", "evidence_level": "rct", "efficacy": "What the literature shows for this indication", "onset": "Expected time to meaningful response", "monitoring": "Required labs / monitoring burden", "key_consideration": "The single most decision-relevant factor for THIS patient", "source": "Journal, year", "url": "Direct link to this source, or empty string" }
    ]
  }
}

Rules:
- RELEVANCE GATE (decide this FIRST): one or more images may be provided. Determine whether AT LEAST ONE is a clinical photograph of human skin, hair, nails, or mucosa suitable for dermatologic assessment. If NONE are — e.g. unrelated objects, scenery, an animal, a screenshot or document, non-clinical photos, or images too blurry/dark/cropped to assess — set "relevant": false, fill "rejection", and STOP: do NOT search the web and do NOT include assessment, references, or treatment_comparison. If at least one image is a valid clinical photograph, set "relevant": true, omit "rejection", base the assessment on the clinical image(s) and disregard any non-clinical ones. When in doubt about borderline but plausibly-clinical images, proceed with relevant:true but note the image-quality limitation in the rationale.
- assessment: 1-2 entries only, ranked by likelihood. No confidence numbers. Include the most specific applicable ICD-10 code in the icd10 field. If no ICD-10 code is confidently applicable, omit the field rather than guessing.
- treatment_comparison: OPTIONAL. Include ONLY when the case genuinely has 2-4 competing viable treatment paths where the choice is non-obvious (treatment-resistant, off-label question, comorbidity complicating first-line, or biologic selection). If one standard path is clearly correct for a routine case, OMIT this field entirely — do not force a comparison. When included: 2-4 options, each grounded in a real recent citation. Reason step by step internally — confirm the diagnosis, search per-treatment evidence, then synthesize trade-offs. Present options with trade-offs; NEVER rank a single 'best'. This is decision support for physician consideration, not a prescribing recommendation.
- url fields (references and treatment sources): include a real, resolvable link ONLY if you found it during search — prefer a DOI link (https://doi.org/...) or PubMed (https://pubmed.ncbi.nlm.nih.gov/...). If you are not confident the link is correct, use an empty string "" — NEVER invent a URL. Every citation stays verifiable because the app adds a PubMed search fallback from the title.
- references: 3-5 entries. After identifying the top diagnosis, search specifically for it — e.g. 'psoriasis scalp dermoscopy JAAD 2024' or 'tinea capitis adult treatment guidelines 2023'. Prefer primary sources from PubMed, JAAD, NEJM, AAD, Cochrane published in the last 10 years. Each reference must be directly applicable to this case, not generic.
- evidence_level on each reference must be one of: 'guideline' (society/national guideline), 'meta-analysis' (systematic review or meta-analysis), 'rct' (randomized controlled trial), 'cohort' (cohort or case-control study), 'review' (narrative review or expert summary), 'case-report' (case report or case series). Pick the single best fit.`;
  try{
    const resp=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:2600,system:sys,tools:[{type:'web_search_20250305',name:'web_search'}],messages:[{role:'user',content:[...images.map(im=>({type:'image',source:{type:'base64',media_type:im.mime,data:im.base64}})),{type:'text',text:`Assess this dermatology case. One or more case images are provided.\n\nPatient context:\n${ctx}\n\nFirst apply the relevance gate. If at least one image is a valid clinical photograph, search for the most relevant recent published literature and return the full analysis; otherwise return the rejection. Return only the structured JSON.`}]}]})});
    let data;
    const contentType=resp.headers.get('content-type')||'';
    if(contentType.includes('application/json')){data=await resp.json();}
    else{const txt=await resp.text();throw new Error(txt.slice(0,300));}
    if(!resp.ok||data.error)throw new Error(JSON.stringify(data.error||data,null,2));
    let raw='';
    for(const b of(data.content||[])){if(b.type==='text')raw+=b.text;}
    if(!raw)throw new Error('No text in response.\n\n'+JSON.stringify(data,null,2));
    let clean=raw.trim();
    const fenceMatch=clean.match(/```(?:json)?\s*([\s\S]*?)```/);
    if(fenceMatch){clean=fenceMatch[1].trim();}else{const b0=clean.indexOf('{'),b1=clean.lastIndexOf('}');if(b0!==-1&&b1!==-1)clean=clean.slice(b0,b1+1);}
    clean=clean.replace(/[\r\n]/g,' ');
    let parsed;try{parsed=JSON.parse(clean);}catch(e){throw new Error('JSON parse failed.\n\nRaw:\n'+raw);}
    if(parsed && parsed.relevant===false){ renderRejection(parsed.rejection||{}); analyzeBtn.disabled=false; return; }
    renderOutput(parsed);
  }catch(err){
    outputArea.innerHTML=`<div class="mt-3 rounded-2xl border p-4" style="background:#F6EBE7;border-color:#E6D5CE;color:#8A3324"><strong class="text-[13px]">${t('errStrong')}</strong><pre class="text-[11px] font-mono-dm whitespace-pre-wrap break-all opacity-80 mt-1">${err.message}</pre></div>`;
    analyzeBtn.disabled=false;
  }
}

function safeUrl(u){u=(u||'').trim();return /^https?:\/\/[^\s"'<>]+$/i.test(u)?u:'';}
function pubmedSearch(title){return 'https://pubmed.ncbi.nlm.nih.gov/?term='+encodeURIComponent(String(title||'').replace(/[^\w\s().-]/g,' ').trim());}
function refHref(r){return safeUrl(r&&r.url)||pubmedSearch(r&&r.title);}
function renderRejection(rej){
  const detected = rej && rej.detected ? `<div class="text-[12px] text-base-content/55 mt-2"><span class="font-medium">${t('rejDetected')}</span> ${rej.detected}</div>` : '';
  const reason = (rej && rej.reason) ? rej.reason : t('rejBody');
  outputArea.innerHTML = `<div class="card bg-base-100 border border-base-300 rounded-2xl mt-3"><div class="card-body p-5 items-start">
    <div class="flex items-start gap-3">
      <span class="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0" style="background:#F7ECDA">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 5l16 14M21 6.5V17a2 2 0 0 1-2 2H7m-3-1V7a2 2 0 0 1 2-2h11" stroke="#9A5B12" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="10" r="1.6" fill="#9A5B12"/></svg>
      </span>
      <div>
        <div class="text-[14px] font-medium">${t('rejTitle')}</div>
        <div class="text-[13px] text-base-content/70 leading-relaxed mt-1">${reason}</div>
        ${detected}
      </div>
    </div>
    <button class="btn btn-primary btn-sm normal-case mt-4" id="rejNewBtn">${t('rejTryAnother')}</button>
  </div></div>`;
  const b=document.getElementById('rejNewBtn'); if(b) b.addEventListener('click',()=>{ resetImages(); outputArea.innerHTML=''; });
}
function renderOutput(d){
  const assessment=d.assessment||[],refs=d.references||[];
  const assessHtml=assessment.map((item,i)=>`<div class="bg-base-200 rounded-lg p-3.5 mb-2 last:mb-0"><div class="flex items-center gap-2 flex-wrap mb-1.5"><span class="text-[14px] font-medium">${item.diagnosis}</span>${item.icd10?`<span class="badge badge-sm font-mono-dm text-[11px] bg-base-100 border-base-300">ICD-10 · ${item.icd10}</span>`:''}</div><div class="text-[13px] text-base-content/70 leading-relaxed">${item.rationale}</div></div>`).join('');
  const evMap={'guideline':{variant:'s',key:'evGuideline'},'meta-analysis':{variant:'s',key:'evMetaAnalysis'},'rct':{variant:'s',key:'evRct'},'cohort':{variant:'m',key:'evCohort'},'review':{variant:'m',key:'evReview'},'case-report':{variant:'w',key:'evCaseReport'}};
  const refHtml=refs.map((r,i)=>{const ev=evMap[r.evidence_level];const pill=ev?`<div class="evp evp-${ev.variant} mb-1.5">${t(ev.key)}</div>`:'';const direct=safeUrl(r.url);const href=direct||pubmedSearch(r.title);const verify=direct?`<a href="${pubmedSearch(r.title)}" target="_blank" rel="noopener noreferrer" class="text-[11px] text-base-content/45 hover:text-primary ml-2 whitespace-nowrap">PubMed ↗</a>`:'';return `<div class="border-b border-base-300 pb-3 mb-3 last:border-0 last:mb-0 last:pb-0">${pill}<a href="${href}" target="_blank" rel="noopener noreferrer" class="text-[13px] font-medium hover:text-primary hover:underline">${r.title} <span class="text-[10px] text-base-content/40">↗</span></a><div class="text-[13px] text-base-content/70 leading-relaxed mt-1">${r.relevance}</div><div class="mt-1.5 flex items-center flex-wrap"><span class="text-[11.5px] text-primary font-mono-dm">${r.source}</span>${verify}</div></div>`;}).join('');
  const tc=d.treatment_comparison;
  let txHtml='';
  if(tc&&Array.isArray(tc.options)&&tc.options.length){
    const axes=[['efficacy','txEfficacy'],['onset','txOnset'],['monitoring','txMonitoring'],['key_consideration','txConsideration']];
    const optCards=tc.options.map(o=>{const ev=evMap[o.evidence_level];const pill=ev?`<span class="evp evp-${ev.variant}">${t(ev.key)}</span>`:'';const rows=axes.filter(([k])=>o[k]).map(([k,lbl])=>`<div class="mt-2"><div class="text-[10.5px] font-medium text-base-content/50 uppercase tracking-wide">${t(lbl)}</div><div class="text-[12.5px] text-base-content/80 leading-snug mt-0.5">${o[k]}</div></div>`).join('');return `<div class="bg-base-200 rounded-lg p-3.5"><div class="flex items-center gap-2 flex-wrap mb-1"><span class="text-[14px] font-medium">${o.name}</span>${pill}</div>${rows}${o.source?`<div class="mt-2"><a href="${safeUrl(o.url)||pubmedSearch(o.name+' '+o.source)}" target="_blank" rel="noopener noreferrer" class="text-[11px] text-primary font-mono-dm hover:underline">${o.source} ↗</a></div>`:''}</div>`;}).join('');
    txHtml=`<div class="border-t border-base-300"></div><div class="card-body p-5"><h3 class="eyebrow-app mb-1">${t('sectionTreatment')}</h3>${tc.rationale?`<div class="text-[12.5px] text-base-content/60 leading-relaxed mb-3">${tc.rationale}</div>`:'<div class="mb-3"></div>'}<div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">${optCards}</div><div class="text-[11px] text-base-content/45 leading-relaxed mt-3">${t('txDisclaimer')}</div></div>`;
  }
  outputArea.innerHTML=`<div class="card bg-base-100 border border-base-300 rounded-2xl overflow-hidden mt-3">${assessHtml?`<div class="card-body p-5 pb-4"><h3 class="eyebrow-app mb-3">${t('sectionAssessment')}</h3>${assessHtml}</div>`:''}${txHtml}${refHtml?`<div class="border-t border-base-300"></div><div class="card-body p-5"><h3 class="eyebrow-app mb-3">${t('sectionLit')}</h3>${refHtml}</div>`:''}</div><div class="flex flex-wrap gap-2 mt-3 mb-6"><button class="btn btn-ghost btn-sm flex-1 min-w-[84px] normal-case" id="saveBtn">${t('saveCase')}</button><button class="btn btn-ghost btn-sm flex-1 min-w-[84px] normal-case" id="copyBtn">${t('copyChart')}</button><button class="btn btn-ghost btn-sm flex-1 min-w-[84px] normal-case" id="pdfBtn">${t('exportPdf')}</button><button class="btn btn-ghost btn-sm flex-1 min-w-[84px] normal-case" id="shareBtn">${t('shareReport')}</button><button class="btn btn-ghost btn-sm flex-1 min-w-[84px] normal-case" id="newBtn">${t('newCase')}</button></div>`;
  analyzeBtn.disabled=false;
  document.getElementById('shareBtn').addEventListener('click',()=>{
    const meta={age:document.getElementById('age').value.trim(),sex:document.getElementById('sex').value,area:document.getElementById('area').value.trim(),duration:document.getElementById('duration').value.trim(),fitz:fitz,sharedAt:new Date().toISOString()};
    const payload=btoa(unescape(encodeURIComponent(JSON.stringify({result:d,meta,lang:currentLang}))));
    const url=window.location.origin+'/report#'+payload;
    navigator.clipboard.writeText(url).then(()=>{const btn=document.getElementById('shareBtn');btn.textContent=t('linkCopied');setTimeout(()=>btn.textContent=t('shareReport'),2000);});
  });
  document.getElementById('pdfBtn').addEventListener('click',()=>{
    const meta={age:document.getElementById('age').value.trim(),sex:document.getElementById('sex').value,area:document.getElementById('area').value.trim(),duration:document.getElementById('duration').value.trim(),fitz:fitz,sharedAt:new Date().toISOString()};
    const payload=btoa(unescape(encodeURIComponent(JSON.stringify({result:d,meta,lang:currentLang}))));
    window.open('/report?print=1#'+payload,'_blank');
  });
  document.getElementById('copyBtn').addEventListener('click',()=>{const lines=['CLINICAL ASSESSMENT'];assessment.forEach(x=>lines.push(`• ${x.diagnosis}${x.icd10?` (ICD-10 ${x.icd10})`:''} — ${x.rationale}`));if(tc&&Array.isArray(tc.options)&&tc.options.length){lines.push('\nTREATMENT OPTIONS');if(tc.rationale)lines.push(tc.rationale);tc.options.forEach(o=>{const ev=o.evidence_level?` [${o.evidence_level}]`:'';lines.push(`• ${o.name}${ev}`);if(o.efficacy)lines.push(`   Efficacy: ${o.efficacy}`);if(o.onset)lines.push(`   Onset: ${o.onset}`);if(o.monitoring)lines.push(`   Monitoring: ${o.monitoring}`);if(o.key_consideration)lines.push(`   Key: ${o.key_consideration}`);if(o.source)lines.push(`   [${o.source}]`);});}lines.push('\nLITERATURE');refs.forEach((r,i)=>{const ev=r.evidence_level?` [${r.evidence_level}]`:'';lines.push(`${i+1}. ${r.title}${ev} — ${r.relevance} [${r.source}] ${refHref(r)}`);});navigator.clipboard.writeText(lines.join('\n')).then(()=>{const btn=document.getElementById('copyBtn');btn.textContent=t('copied');setTimeout(()=>btn.textContent=t('copyChart'),2000);});});
  document.getElementById('saveBtn').addEventListener('click',async ()=>{const meta={age:document.getElementById('age').value.trim(),sex:document.getElementById('sex').value,area:document.getElementById('area').value.trim(),duration:document.getElementById('duration').value.trim(),fitz:fitz};const btn=document.getElementById('saveBtn');const u=window.__getCloudUser&&window.__getCloudUser();if(u){try{const dx=(d.assessment&&d.assessment[0]&&d.assessment[0].diagnosis)||'—';await DermCaseCloud.saveCase({dx,meta,result:d});btn.textContent=t('savedCloud');}catch(e){saveCase(d,meta);btn.textContent=t('caseSaved');}}else{saveCase(d,meta);btn.textContent=t('caseSaved');}setTimeout(()=>btn.textContent=t('saveCase'),2000);});
  document.getElementById('newBtn').addEventListener('click',()=>{resetImages();['age','sex','area','duration','notes'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});outputArea.innerHTML='';fitz='';if(window.__renderFitz)window.__renderFitz();});
}
</script>
<script>
// ── Local case history (localStorage only, never leaves device) ──
const HKEY = 'dermcase_history';
function loadHistory(){ try { return JSON.parse(localStorage.getItem(HKEY) || '[]'); } catch(e){ return []; } }
function saveHistory(arr){ try { localStorage.setItem(HKEY, JSON.stringify(arr)); } catch(e){} }
function saveCase(result, meta){
  const arr = loadHistory();
  const dx = (result.assessment && result.assessment[0] && result.assessment[0].diagnosis) || '—';
  arr.unshift({ id: Date.now(), savedAt: new Date().toISOString(), dx, meta, result });
  saveHistory(arr.slice(0, 50));
  renderHistory();
}
function deleteCase(id){
  saveHistory(loadHistory().filter(x => x.id !== id));
  renderHistory();
}
function clearAllCases(){
  if (confirm(t('confirmClear'))) { saveHistory([]); renderHistory(); }
}
function renderHistory(){
  const arr = loadHistory();
  const el = document.getElementById('historyArea');
  if (!el) return;
  if (!arr.length){ el.innerHTML = ''; return; }
  const rows = arr.map(x => {
    const d = new Date(x.savedAt);
    const dateStr = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    const ctx = [x.meta && x.meta.age && (x.meta.age+'y'), x.meta && x.meta.sex, x.meta && x.meta.area, x.meta && x.meta.fitz && ('Fitz '+x.meta.fitz)].filter(Boolean).join(' · ');
    return `<div class="flex items-center justify-between gap-2 py-2.5 border-b border-base-300 last:border-0">
      <button class="text-left flex-1 min-w-0" onclick="reopenCase(${x.id})">
        <div class="text-[13px] font-medium truncate">${x.dx}</div>
        <div class="text-[11.5px] text-base-content/55 truncate">${ctx ? ctx + ' · ' : ''}${dateStr}</div>
      </button>
      <button class="text-[11px] text-base-content/40 hover:text-error flex-shrink-0" onclick="deleteCase(${x.id})">${t('deleteCase')}</button>
    </div>`;
  }).join('');
  el.innerHTML = `<div class="card bg-base-100 border border-base-300 rounded-2xl"><div class="card-body p-5">
    <div class="flex items-center justify-between mb-1">
      <h3 class="eyebrow-app">${t('savedCases')}</h3>
      <button class="text-[11.5px] text-base-content/50 hover:text-error" onclick="clearAllCases()">${t('clearAll')}</button>
    </div>
    <div class="text-[11px] text-base-content/45 leading-relaxed mb-2">${t('storageNote')}</div>
    ${rows}
  </div></div>`;
}
function reopenCase(id){
  const x = loadHistory().find(c => c.id === id);
  if (!x) return;
  renderOutput(x.result);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
document.addEventListener('DOMContentLoaded', renderHistory);
</script>
<script>
// Cloud auth wiring (additive — anonymous/local path is untouched).
(function(){
  let cloudUser = null;
  const slot = document.getElementById('authSlot');
  function link(href,label){ return '<a href="'+href+'" class="px-3 py-1.5 rounded-lg text-base-content/70 hover:text-base-content hover:bg-base-300/60 transition">'+label+'</a>'; }
  function renderAuth(){
    if(!slot) return;
    if(cloudUser){
      slot.innerHTML = link('/library', t('navLibrary')) + '<button id="navSignOut" class="px-3 py-1.5 rounded-lg text-base-content/70 hover:text-base-content hover:bg-base-300/60 transition">'+t('navSignOut')+'</button>';
      const so = document.getElementById('navSignOut');
      if(so) so.addEventListener('click', async()=>{ try{ await DermCaseCloud.signOut(); }catch(e){} window.location.reload(); });
    } else {
      slot.innerHTML = link('/login', t('navSignIn'));
    }
  }
  window.__renderAuth = renderAuth;
  window.__getCloudUser = function(){ return cloudUser; };
  (async function(){
    try{
      if(window.DermCaseCloud && DermCaseCloud.enabled()){
        cloudUser = await DermCaseCloud.user();
        renderAuth();
        DermCaseCloud.onAuthChange(function(u){ cloudUser = u; renderAuth(); });
      }
      // If cloud isn't configured, authSlot stays empty (clean degradation).
    }catch(e){ /* leave anonymous */ }
  })();
})();
</script>
