<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DermCase</title>
<meta name="theme-color" content="#F4F5F3">
<link rel="icon" type="image/svg+xml" href="/assets/darae-ink.svg">
<link rel="apple-touch-icon" href="/assets/favicon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0C0E11" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DermCase">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="/assets/ds.css">
<script src="/assets/ds.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<script src="/dermcase-cloud.js"></script>
<script src="/assets/pwa.js" defer></script>
</head>
<body data-install>
<div class="spectrum" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
<header class="nav">
  <div class="wrap wide nav-in">
    <a class="brand" href="/"><img class="mark mark-ink" src="/assets/darae-ink.svg" alt="" width="26" height="26"><span>DermCase</span></a>
    <nav class="nav-links" aria-label="Main">
      <span id="authSlot" style="display:contents"></span>
      <a class="nav-link" href="/about" data-i18n="navAbout"></a>
      <button class="icon-btn" type="button" data-theme-toggle aria-label="Toggle theme">
        <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </nav>
  </div>
</header>

<main class="wrap wide work">
  <aside class="case" aria-label="Case">
    <div class="case-sec">
      <div class="case-head"><h2 data-i18n="caseTitle"></h2><button type="button" id="sampleBtn" class="link" data-i18n="trySample"></button></div>
      <div class="bed" id="dropZone">
        <input type="file" id="fileInput" accept="image/*" multiple class="hide" aria-label="Case photos">
        <button type="button" class="bed-prompt" id="uploadPrompt">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="26" height="19" rx="3.5"/><circle cx="16" cy="17.5" r="5"/><path d="M11 8l1.6-3h6.8L21 8"/></svg>
          <span class="t1" data-i18n="uploadText"></span>
          <span class="t2" data-i18n="uploadSub"></span>
        </button>
        <div class="bed-load" id="uploadLoading"><span class="spin"></span><span data-i18n="optimizing"></span></div>
        <div class="thumbs" id="thumbGrid" style="display:none"></div>
      </div>
    </div>
    <div class="case-sec">
      <div class="grid2">
        <div class="field"><label for="age" data-i18n="age"></label><input class="input" type="number" id="age" inputmode="numeric" min="0" max="120" data-i18n-placeholder="agePh"></div>
        <div class="field"><label for="sex" data-i18n="sex"></label><div class="select-wrap"><select class="select" id="sex">
          <option value="" data-i18n="sexSelect"></option><option value="Male" data-i18n="sexMale"></option><option value="Female" data-i18n="sexFemale"></option><option value="Other" data-i18n="sexOther"></option>
        </select></div></div>
        <div class="field span2"><label for="area" data-i18n="area"></label><input class="input" type="text" id="area" data-i18n-placeholder="areaPh"></div>
        <div class="field"><label for="duration" data-i18n="duration"></label><input class="input" type="text" id="duration" data-i18n-placeholder="durationPh"></div>
        <div class="field"><label for="lang" data-i18n="reportLang"></label><div class="select-wrap"><select class="select" id="lang"><option value="ko">한국어</option><option value="en">English</option></select></div></div>
        <div class="field span2">
          <span class="lbl" id="fitzLbl" data-i18n="fitzLabel"></span>
          <div class="fitz" id="fitzPicker" role="group" aria-labelledby="fitzLbl">
            <button type="button" class="fitz-chip" data-fitz="I" aria-pressed="false">I</button>
            <button type="button" class="fitz-chip" data-fitz="II" aria-pressed="false">II</button>
            <button type="button" class="fitz-chip" data-fitz="III" aria-pressed="false">III</button>
            <button type="button" class="fitz-chip" data-fitz="IV" aria-pressed="false">IV</button>
            <button type="button" class="fitz-chip" data-fitz="V" aria-pressed="false">V</button>
            <button type="button" class="fitz-chip" data-fitz="VI" aria-pressed="false">VI</button>
          </div>
          <div id="fitzDesc" class="fitz-desc"></div>
        </div>
        <div class="field span2"><label for="notes" data-i18n="notes"></label><textarea class="textarea" id="notes" data-i18n-placeholder="notesPh"></textarea></div>
      </div>
    </div>
    <div class="case-sec act">
      <button class="btn btn-solid btn-block" id="analyzeBtn" type="button" disabled data-i18n="analyzeBtn"></button>
      <p class="fine send-note"><span data-i18n="sendNote"></span> <a class="link" href="/privacy" data-i18n="privacyLink"></a></p>
      <p class="fine" style="margin-top:12px" data-i18n="deid"></p>
    </div>
  </aside>

  <section class="out" aria-label="Brief">
    <div id="status" class="sr" role="status"></div>
    <div id="emptyState" class="empty">
      <h2 data-i18n="emptyTitle"></h2>
      <p data-i18n="emptyBody"></p>
      <button class="btn btn-line" id="emptyExample" type="button" style="margin-top:20px" data-i18n="seeExample"></button>
      <div class="ghost" aria-hidden="true">
        <div><i class="s"></i><i class="l"></i><i class="m"></i></div>
        <div><i class="s"></i><i class="l"></i><i class="l"></i><i class="m"></i></div>
      </div>
    </div>
    <div id="outputArea"></div>
    <div id="historyArea"></div>
    <p class="page-foot" data-i18n="disclaimer"></p>
    <p class="page-foot"><a class="link" href="/privacy" data-i18n="privacyLink"></a></p>
  </section>
</main>

function processFile(file){
  return new Promise((resolve,reject)=>{
    if(!file||!file.type.startsWith('image/')){reject();return;}
    const img=new Image();const url=URL.createObjectURL(file);
    img.onload=()=>{URL.revokeObjectURL(url);const MAX=1200;let w=img.width,h=img.height;if(w>MAX||h>MAX){const s=Math.min(MAX/w,MAX/h);w=Math.round(w*s);h=Math.round(h*s);}const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);const dataUrl=cv.toDataURL('image/jpeg',0.82);resolve({base64:dataUrl.split(',')[1],mime:'image/jpeg',dataUrl});};
    img.onerror=()=>{URL.revokeObjectURL(url);reject();};
    img.src=url;
  });
}
async function loadImages(fileList){

}

async function runAnalysis(){
  const age=document.getElementById('age').value.trim(),sex=document.getElementById('sex').value,area=document.getElementById('area').value.trim(),duration=document.getElementById('duration').value.trim(),notes=document.getElementById('notes').value.trim(),lang=document.getElementById('lang').value;currentLang=lang;
  const ctx=[age&&`Age: ${age}`,sex&&`Sex: ${sex}`,area&&`Affected area: ${area}`,duration&&`Duration: ${duration}`,fitz&&`Fitzpatrick skin type: ${fitz}`,notes&&`Notes: ${notes}`].filter(Boolean).join('\n')||'No patient context provided.';
  const langInstruction=lang==='ko'?'IMPORTANT: Write ALL text in your JSON response in Korean (한국어). This includes diagnosis names, rationale, and reference relevance text. Only keep source citations and DOIs in their original language.':'Write all response text in English.';
  analyzeBtn.disabled=true;showProgress();scrollToBrief();aborter=new AbortController();
  const sys=`You are a clinical literature assistant for practicing dermatologists. Analyze the case photo and patient context. Return ONLY a valid JSON object — no markdown fences, no preamble, nothing outside the JSON.

${langInstruction}

{
  "relevant": true,
  "rejection": { "reason": "If relevant is false: one friendly sentence on why this image cannot be assessed", "detected": "If relevant is false: a few words on what the image appears to show" },
  "assessment": [
    { "diagnosis": "Diagnosis name", "icd10": "L40.0", "rationale": "1-2 sentence clinical rationale based on visible morphology and patient context" }
  ],
  "references": [
    { "title": "Paper or guideline title", "relevance": "1-2 sentences on direct applicability to this specific case", "source": "Journal, year", "url": "Direct link from your search — DOI (https://doi.org/...) or PubMed (https://pubmed.ncbi.nlm.nih.gov/...); empty string if you have no reliable link", "evidence_level": "guideline" }
  ],
  "treatment_comparison": {
    "rationale": "1 sentence on why these specific options are in contention for THIS patient",
    "options": [
      { "name": "Treatment name", "evidence_level": "rct", "efficacy": "What the literature shows for this indication", "onset": "Expected time to meaningful response", "monitoring": "Required labs / monitoring burden", "key_consideration": "The single most decision-relevant factor for THIS patient", "source": "Journal, year", "url": "Direct link to this source, or empty string" }
    ]
  }
}

Rules:
- RELEVANCE GATE (decide this FIRST): one or more images may be provided. Determine whether AT LEAST ONE is a clinical photograph of human skin, hair, nails, or mucosa suitable for dermatologic assessment. If NONE are — e.g. unrelated objects, scenery, an animal, a screenshot or document, non-clinical photos, or images too blurry/dark/cropped to assess — set "relevant": false, fill "rejection", and STOP: do NOT search the web and do NOT include assessment, references, or treatment_comparison. If at least one image is a valid clinical photograph, set "relevant": true, omit "rejection", base the assessment on the clinical image(s) and disregard any non-clinical ones. When in doubt about borderline but plausibly-clinical images, proceed with relevant:true but note the image-quality limitation in the rationale.
- LENGTH BUDGET (strict, the response MUST always finish): keep the whole JSON short. Every rationale and relevance is ONE sentence of at most 25 words (in Korean, at most about 70 characters). Every treatment option field (efficacy, onset, monitoring, key_consideration) is ONE short phrase of at most 15 words (in Korean, at most about 45 characters). treatment_comparison has 2-3 options. Brevity beats completeness. Never trail off: if you are running long, drop the least important reference or option instead of writing more.
- assessment: 1-2 entries only, ranked by likelihood. No confidence numbers. Include the most specific applicable ICD-10 code in the icd10 field. If no ICD-10 code is confidently applicable, omit the field rather than guessing.
- treatment_comparison: OPTIONAL. Include ONLY when the case genuinely has 2-4 competing viable treatment paths where the choice is non-obvious (treatment-resistant, off-label question, comorbidity complicating first-line, or biologic selection). If one standard path is clearly correct for a routine case, OMIT this field entirely — do not force a comparison. When included: 2-4 options, each grounded in a real recent citation. Reason step by step internally — confirm the diagnosis, search per-treatment evidence, then synthesize trade-offs. Present options with trade-offs; NEVER rank a single 'best'. This is decision support for physician consideration, not a prescribing recommendation.
- url fields (references and treatment sources): include a real, resolvable link ONLY if you found it during search — prefer a DOI link (https://doi.org/...) or PubMed (https://pubmed.ncbi.nlm.nih.gov/...). If you are not confident the link is correct, use an empty string "" — NEVER invent a URL. Every citation stays verifiable because the app adds a PubMed search fallback from the title.
- references: 3-4 entries. After identifying the top diagnosis, search specifically for it — e.g. 'psoriasis scalp dermoscopy JAAD 2024' or 'tinea capitis adult treatment guidelines 2023'. Prefer primary sources from PubMed, JAAD, NEJM, AAD, Cochrane published in the last 10 years. Each reference must be directly applicable to this case, not generic.
- evidence_level on each reference must be one of: 'guideline' (society/national guideline), 'meta-analysis' (systematic review or meta-analysis), 'rct' (randomized controlled trial), 'cohort' (cohort or case-control study), 'review' (narrative review or expert summary), 'case-report' (case report or case series). Pick the single best fit.`;
  try{
    const resp=await fetch('/api/analyze',{method:'POST',signal:aborter.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:3000,system:sys,tools:[{type:'web_search_20250305',name:'web_search'}],messages:[{role:'user',content:[...images.map(im=>({type:'image',source:{type:'base64',media_type:im.mime,data:im.base64}})),{type:'text',text:`Assess this dermatology case. One or more case images are provided.\n\nPatient context:\n${ctx}\n\nFirst apply the relevance gate. If at least one image is a valid clinical photograph, search for the most relevant recent published literature and return the full analysis; otherwise return the rejection. Return only the structured JSON.`}]}]})});
    let data;
    const contentType=resp.headers.get('content-type')||'';
    if(contentType.includes('application/json')){data=await resp.json();}
    else{const txt=await resp.text();throw new Error(txt.slice(0,300));}
    if(!resp.ok||data.error)throw new Error(JSON.stringify(data.error||data,null,2));
    let raw='';
    for(const b of(data.content||[])){if(b.type==='text')raw+=b.text;}
    if(!raw)throw new Error('No text in response.\n\n'+JSON.stringify(data,null,2));
    let clean=raw.trim();
    const fenceMatch=clean.match(/```(?:json)?\s*([\s\S]*?)```/);
    if(fenceMatch){clean=fenceMatch[1].trim();}else{const b0=clean.indexOf('{'),b1=clean.lastIndexOf('}');if(b0!==-1&&b1!==-1)clean=clean.slice(b0,b1+1);}
    clean=clean.replace(/[\r\n]/g,' ');
    let parsed,partial=false;
    try{parsed=JSON.parse(clean);}
    catch(e){

      if(fixed&&fixed.assessment&&fixed.assessment.length){parsed=fixed;partial=true;}
      else{const er=new Error('JSON parse failed.\n\nRaw:\n'+raw);er.truncated=(data.stop_reason==='max_tokens');throw er;}
    }
    if(parsed && parsed.relevant===false){ renderRejection(parsed.rejection||{}); analyzeBtn.disabled=false; return; }
    renderOutput(parsed,null,{partial:partial});
  }catch(err){
    if(err&&err.name==='AbortError'){setOutput('');analyzeBtn.disabled=images.length===0;announce(t('canceled'));return;}
    setOutput(`<div class="notice err" role="alert"><span class="notice-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/></svg></span><div><h3>${esc(t('errTitle'))}</h3><p>${esc(err&&err.truncated?t('errCut'):t('errHint'))}</p><button class="btn btn-solid btn-sm" id="retryBtn" type="button">${esc(t('rerun'))}</button><pre>${esc(String(err&&err.message||err).slice(0,400))}</pre></div></div>`);

    const rb=document.getElementById('retryBtn'); if(rb) rb.addEventListener('click',()=>{ analyzeBtn.click(); });
  }finally{stopTimer();aborter=null;}
}

/*REPAIR_START*/
function repairJson(s){
  // A cut-off answer is unfinished JSON. Keep everything up to the last complete value, then close what is still open.
  var stack=[],inStr=false,esc=false,cut=-1,closers='',i,ch;
  for(i=0;i<s.length;i++){
    ch=s.charAt(i);
    if(inStr){ if(esc)esc=false; else if(ch==='\\')esc=true; else if(ch==='"')inStr=false; continue; }
    if(ch==='"'){inStr=true;continue;}
    if(ch==='{')stack.push('}'); else if(ch==='[')stack.push(']');
    else if(ch==='}'||ch===']'){ stack.pop(); cut=i+1; closers=stack.slice().reverse().join(''); }
  }
  if(cut<0)return null;
  try{ return JSON.parse(s.slice(0,cut)+closers); }catch(e){ return null; }
}
/*REPAIR_END*/

    txHtml=`<section class="sec"><h2 class="sec-h">${esc(t('sectionTreatment'))}</h2>${tc.rationale?`<p class="sec-lede">${esc(tc.rationale)}</p>`:''}<div class="cmp"><div class="cmp-grid" style="--n:${n}">${cells}</div></div><p class="fine">${esc(t('txDisclaimer'))}</p></section>`;
  }
  const refHtml=refs.map(r=>{const direct=safeUrl(r.url);const href=direct||pubmedSearch(r.title);const extra=direct?`<a href="${pubmedSearch(r.title)}" target="_blank" rel="noopener noreferrer">${esc(t('refVerify'))}</a>`:`<span>${esc(t('refSearch'))}</span>`;return `<div class="ref"><div>${tier(r.evidence_level)}</div><div><a class="ref-t" href="${href}" target="_blank" rel="noopener noreferrer">${esc(r.title)}<span aria-hidden="true"> ↗</span></a><p class="ref-rel">${esc(r.relevance)}</p><div class="ref-src"><span>${esc(r.source)}</span>${extra}</div></div></div>`;}).join('');
  const fullActions=`<div class="actions"><button class="btn btn-solid btn-sm" id="saveBtn" type="button">${esc(t('saveCase'))}</button><button class="btn btn-line btn-sm" id="copyBtn" type="button">${esc(t('copyChart'))}</button><button class="btn btn-line btn-sm" id="pdfBtn" type="button">${esc(t('exportPdf'))}</button><button class="btn btn-line btn-sm" id="shareBtn" type="button">${esc(t('shareReport'))}</button><button class="btn btn-quiet btn-sm" id="newBtn" type="button">${esc(t('newCase'))}</button></div>`;
  const exActions=`<div class="actions"><button class="btn btn-quiet btn-sm" id="newBtn" type="button">${esc(t('clearExample'))}</button></div>`;
  const exBanner=`<div class="ex-banner"><span class="ex-tag">${esc(t('exTag'))}</span><span>${esc(t('exNote'))}</span></div>`;
  setOutput(`<article class="brief" id="brief"><div class="brief-head"><div class="ctx">${ctxHtml(meta)}</div>${ex?exActions:fullActions}</div>${ex?exBanner:''}${partialBanner}${assessHtml?`<section class="sec"><h2 class="sec-h">${esc(t('sectionAssessment'))}</h2><div class="dx-list">${assessHtml}</div></section>`:''}${txHtml}${refHtml?`<section class="sec"><h2 class="sec-h">${esc(t('sectionLit'))}</h2>${refHtml}</section>`:''}</article>`);
  analyzeBtn.disabled=images.length===0;
  announce(t('ready'));
  scrollToBrief();
  const rr=document.getElementById('rerunBtn'); if(rr) rr.addEventListener('click',()=>{ analyzeBtn.click(); });
  if(!ex){
  document.getElementById('shareBtn').addEventListener('click',()=>{
    const url=window.location.origin+'/report#'+payloadFor(d,meta);
    navigator.clipboard.writeText(url).then(()=>{const btn=document.getElementById('shareBtn');btn.textContent=t('linkCopied');setTimeout(()=>btn.textContent=t('shareReport'),2000);});
  });
  document.getElementById('pdfBtn').addEventListener('click',()=>{ window.open('/report?print=1#'+payloadFor(d,meta),'_blank'); });
  document.getElementById('copyBtn').addEventListener('click',()=>{const lines=[t('sectionAssessment').toUpperCase()];assessment.forEach(x=>lines.push(`• ${x.diagnosis}${x.icd10?` (ICD-10 ${x.icd10})`:''}: ${x.rationale}`));if(tc&&Array.isArray(tc.options)&&tc.options.length){lines.push('\n'+t('sectionTreatment').toUpperCase());if(tc.rationale)lines.push(tc.rationale);tc.options.forEach(o=>{const ev=o.evidence_level?` [${o.evidence_level}]`:'';lines.push(`• ${o.name}${ev}`);if(o.efficacy)lines.push(`   Efficacy: ${o.efficacy}`);if(o.onset)lines.push(`   Onset: ${o.onset}`);if(o.monitoring)lines.push(`   Monitoring: ${o.monitoring}`);if(o.key_consideration)lines.push(`   Key: ${o.key_consideration}`);if(o.source)lines.push(`   [${o.source}]`);});}lines.push('\n'+t('sectionLit').toUpperCase());refs.forEach((r,i)=>{const ev=r.evidence_level?` [${r.evidence_level}]`:'';lines.push(`${i+1}. ${r.title}${ev}: ${r.relevance} [${r.source}] ${refHref(r)}`);});navigator.clipboard.writeText(lines.join('\n')).then(()=>{const btn=document.getElementById('copyBtn');btn.textContent=t('copied');setTimeout(()=>btn.textContent=t('copyChart'),2000);});});
  document.getElementById('saveBtn').addEventListener('click',async ()=>{const btn=document.getElementById('saveBtn');const u=window.__getCloudUser&&window.__getCloudUser();const m=Object.assign({},meta);if(u){try{const dx=(d.assessment&&d.assessment[0]&&d.assessment[0].diagnosis)||'-';await DermCaseCloud.saveCase({dx,meta:m,result:d});btn.textContent=t('savedCloud');}catch(e){saveCase(d,m);btn.textContent=t('caseSaved');}}else{saveCase(d,m);btn.textContent=t('caseSaved');}setTimeout(()=>btn.textContent=t('saveCase'),2000);});
  }
  document.getElementById('newBtn').addEventListener('click',()=>{resetImages();['age','sex','area','duration','notes'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});setOutput('');fitz='';if(window.__renderFitz)window.__renderFitz();window.scrollTo({top:0,behavior:'smooth'});});
}
</script>
<script>
// Local case history (localStorage only, never leaves the device)
const HKEY = 'dermcase_history';
function loadHistory(){ try { return JSON.parse(localStorage.getItem(HKEY) || '[]'); } catch(e){ return []; } }
function saveHistory(arr){ try { localStorage.setItem(HKEY, JSON.stringify(arr)); } catch(e){} }
function saveCase(result, meta){
  const arr = loadHistory();
  const dx = (result.assessment && result.assessment[0] && result.assessment[0].diagnosis) || '-';
  arr.unshift({ id: Date.now(), savedAt: new Date().toISOString(), dx, meta, result });
  saveHistory(arr.slice(0, 50));
  renderHistory();
}
function deleteCase(id){ saveHistory(loadHistory().filter(x => x.id !== id)); renderHistory(); }
function clearAllCases(){ if (confirm(t('confirmClear'))) { saveHistory([]); renderHistory(); } }
function renderHistory(){
  const arr = loadHistory();
  const el = document.getElementById('historyArea');
  if (!el) return;
  if (!arr.length){ el.innerHTML = ''; return; }
  const rows = arr.map(x => {
    const d = new Date(x.savedAt);
    const dateStr = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    const m = x.meta || {};
    const ctx = [m.age && (m.age + t('ageUnit')), m.area, m.fitz && ('Fitzpatrick ' + m.fitz)].filter(Boolean).join(', ');
    return `<div class="hist-row">
      <button class="open" type="button" data-open="${x.id}">
        <div class="dx-n">${esc(x.dx)}</div>
        <div class="dx-s">${esc(ctx ? ctx + ', ' : '')}${esc(dateStr)}</div>
      </button>
      <button class="hist-del" type="button" data-del="${x.id}">${esc(t('deleteCase'))}</button>
    </div>`;
  }).join('');
  el.innerHTML = `<div class="hist">
    <div class="hist-head"><h3>${esc(t('savedCases'))}</h3><button class="hist-del" type="button" id="histClear">${esc(t('clearAll'))}</button></div>
    <p class="fine" style="margin-top:4px">${esc(t('storageNote'))}</p>
    ${rows}
  </div>`;
  el.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => reopenCase(parseInt(b.getAttribute('data-open'),10))));
  el.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => deleteCase(parseInt(b.getAttribute('data-del'),10))));
  const hc = document.getElementById('histClear'); if (hc) hc.addEventListener('click', clearAllCases);
}
window.__renderHistory = renderHistory;
function reopenCase(id){
  const x = loadHistory().find(c => c.id === id);
  if (!x) return;
  renderOutput(x.result, x.meta);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
document.addEventListener('DOMContentLoaded', renderHistory);
</script>
<script>
// Cloud auth wiring (additive; the anonymous/local path is untouched).
(function(){
  let cloudUser = null;
  const slot = document.getElementById('authSlot');
  function link(href,label){ return '<a href="'+href+'" class="nav-link">'+label+'</a>'; }
  function renderAuth(){
    if(!slot) return;
    if(cloudUser){
      slot.innerHTML = link('/library', t('navLibrary')) + '<button id="navSignOut" type="button" class="nav-link">'+t('navSignOut')+'</button>';
      const so = document.getElementById('navSignOut');
      if(so) so.addEventListener('click', async()=>{ try{ await DermCaseCloud.signOut(); }catch(e){} window.location.reload(); });
    } else {
      slot.innerHTML = link('/login', t('navSignIn'));
    }
  }
  window.__renderAuth = renderAuth;
  window.__getCloudUser = function(){ return cloudUser; };
  (async function(){
    try{
      if(window.DermCaseCloud && DermCaseCloud.enabled()){
        cloudUser = await DermCaseCloud.user();
        renderAuth();
        DermCaseCloud.onAuthChange(function(u){ cloudUser = u; renderAuth(); });
      }
    }catch(e){ /* leave anonymous */ }
  })();
})();
</script>
