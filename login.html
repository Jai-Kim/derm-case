<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DermCase | Sign in</title>
<meta name="theme-color" content="#F4F5F3">
<link rel="icon" type="image/svg+xml" href="/assets/darae-ink.svg">
<link rel="apple-touch-icon" href="/assets/favicon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0C0E11" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DermCase">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="/assets/ds.css">
<script src="/assets/ds.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<script src="/dermcase-cloud.js"></script>
</head>
<body>
<div class="spectrum" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
<header class="nav">
  <div class="wrap wide nav-in">
    <a class="brand" href="/"><img class="mark mark-ink" src="/assets/darae-ink.svg" alt="" width="26" height="26"><span>DermCase</span></a>
    <nav class="nav-links" aria-label="Main">
      <a class="nav-link" href="/app" data-i18n="navApp"></a>
      <button class="nav-link" id="langBtn" type="button">EN</button>
      <button class="icon-btn" type="button" data-theme-toggle aria-label="Toggle theme">
        <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      
    </nav>
  </div>
</header>
<main class="wrap center">
  <div class="auth">
    <h1 id="title"></h1>
    <p class="sub" id="subtitle"></p>
    <div class="form" id="formArea">
      <div class="field"><label for="email" data-i18n="email"></label><input class="input" type="email" id="email" autocomplete="email" placeholder="you@clinic.com"></div>
      <div class="field"><label for="password" data-i18n="password"></label><input class="input" type="password" id="password" autocomplete="current-password"></div>
      <button class="btn btn-solid btn-block" id="submitBtn" type="button"></button>
      <div id="msg" class="msg" role="status"></div>
    </div>
    <div class="auth-alt"><button id="toggleMode" type="button" class="link"></button></div>
    <p class="auth-fine" data-i18n="privacy"></p>
    <p class="auth-fine"><a href="/app" data-i18n="skip"></a></p>
  </div>
</main>
<script>
const I18N = {
  ko: {
    navApp: '앱으로',
    signInTitle: '다시 오신 것을 환영합니다', signUpTitle: '계정 만들기',
    signInSub: '저장한 증례를 모든 기기에서 동기화하세요', signUpSub: '증례를 클라우드에 안전하게 보관하세요',
    email: '이메일', password: '비밀번호',
    signInBtn: '로그인', signUpBtn: '가입하기',
    toSignUp: '계정이 없으신가요? 가입하기', toSignIn: '이미 계정이 있으신가요? 로그인',
    privacy: '증례 사진은 저장되지 않습니다. 클라우드에는 구조화된 증례 정보만 보관되며, 본인만 접근할 수 있습니다.',
    skip: '로그인 없이 계속',
    checkEmail: '확인 이메일을 보냈습니다. 메일함을 확인해 주세요.',
    notConfigured: '클라우드 계정이 아직 설정되지 않았습니다. 로그인 없이 앱을 사용할 수 있습니다.',
    working: '처리 중',
  },
  en: {
    navApp: 'Open app',
    signInTitle: 'Welcome back', signUpTitle: 'Create your account',
    signInSub: 'Sync your saved cases across devices', signUpSub: 'Keep your cases safely in the cloud',
    email: 'Email', password: 'Password',
    signInBtn: 'Sign in', signUpBtn: 'Create account',
    toSignUp: "Don't have an account? Sign up", toSignIn: 'Already have an account? Sign in',
    privacy: 'Case photos are never stored. The cloud holds only the structured case, accessible to you alone.',
    skip: 'Continue without an account',
    checkEmail: 'Check your email to confirm your account.',
    notConfigured: 'Cloud accounts aren\u2019t set up yet. You can use the app without signing in.',
    working: 'Working',
  }
};
let lang = (window.dcLang ? dcLang.get() : 'ko');
let mode = 'signin';
function t(k){ return I18N[lang][k] || I18N.en[k] || k; }
const $ = id => document.getElementById(id);

function render(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.getAttribute('data-i18n')));
  $('langBtn').textContent = lang === 'ko' ? 'EN' : '한국어';
  $('title').textContent = mode === 'signin' ? t('signInTitle') : t('signUpTitle');
  $('subtitle').textContent = mode === 'signin' ? t('signInSub') : t('signUpSub');
  $('submitBtn').textContent = mode === 'signin' ? t('signInBtn') : t('signUpBtn');
  $('toggleMode').textContent = mode === 'signin' ? t('toSignUp') : t('toSignIn');
  $('password').autocomplete = mode === 'signin' ? 'current-password' : 'new-password';
}
function setMsg(text, kind){
  const el = $('msg');
  el.textContent = text || '';
  el.className = 'msg' + (kind ? ' ' + kind : '');
}

$('langBtn').addEventListener('click', () => { lang = lang === 'ko' ? 'en' : 'ko'; if(window.dcLang) dcLang.set(lang); render(); });
$('toggleMode').addEventListener('click', () => { mode = mode === 'signin' ? 'signup' : 'signin'; setMsg(''); render(); });

$('submitBtn').addEventListener('click', async () => {
  setMsg('');
  if (!window.DermCaseCloud || !DermCaseCloud.enabled()) { setMsg(t('notConfigured'), 'error'); return; }
  const email = $('email').value.trim(), pw = $('password').value;
  if (!email || !pw) return;
  $('submitBtn').disabled = true; const orig = $('submitBtn').textContent; $('submitBtn').textContent = t('working');
  try {
    if (mode === 'signin') {
      await DermCaseCloud.signIn(email, pw);
      window.location.href = '/app';
    } else {
      const data = await DermCaseCloud.signUp(email, pw);
      if (data && data.session) { window.location.href = '/app'; }
      else { setMsg(t('checkEmail'), 'ok'); }
    }
  } catch (e) {
    setMsg(e.message || String(e), 'error');
  } finally {
    $('submitBtn').disabled = false; $('submitBtn').textContent = orig;
  }
});
render();
</script>
</body>
</html>
