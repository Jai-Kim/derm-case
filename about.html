<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About — DermCase Assistant</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
[data-theme="dermcase"] {
  --color-primary: #1A6640; --color-primary-content: #FFFFFF; --color-secondary: #0D3D22;
  --color-base-100: #FFFFFF; --color-base-200: #F5F4F0; --color-base-300: #E0DDD5; --color-base-content: #18170F;
  --color-success: #0F6E56; --color-info: #0C447C; --color-warning: #854F0B;
}
body { font-family: 'DM Sans', sans-serif; background: #F5F4F0; color: #18170F; -webkit-font-smoothing: antialiased; }
.mono { font-family: 'DM Mono', monospace; }
.display { letter-spacing: -0.025em; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.page-enter { animation: rise .5s cubic-bezier(.22,1,.36,1) both; }
@media (prefers-reduced-motion: reduce) { .page-enter { animation: none; } }
</style>
</head>
<body data-theme="dermcase">

<nav class="sticky top-0 z-30 backdrop-blur bg-base-200/80 border-b border-base-300">
  <div class="max-w-[1100px] mx-auto px-5 h-14 flex items-center justify-between">
    <a href="/" class="flex items-center gap-2.5 group">
      <span class="w-7 h-7 rounded-lg bg-primary flex items-center justify-center transition-transform group-hover:rotate-[8deg]">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 2.5L13 5v6l-5 2.5L3 11V5l5-2.5z" stroke="white" stroke-width="1.3" stroke-linejoin="round"/></svg>
      </span>
      <span class="text-[14px] font-medium tracking-tight">DermCase</span>
    </a>
    <div class="flex items-center gap-1 text-[13px]">
      <a href="/" class="px-3 py-1.5 rounded-lg text-base-content/70 hover:text-base-content hover:bg-base-300/60 transition" data-i18n="navHome"></a>
      <button id="langBtn" class="px-2.5 py-1.5 rounded-lg text-base-content/60 hover:text-base-content hover:bg-base-300/60 transition mono text-[12px]">EN</button>
      <a href="/app.html" class="ml-1 btn btn-primary btn-sm normal-case rounded-lg" data-i18n="navOpen"></a>
    </div>
  </div>
</nav>

<main class="max-w-[760px] mx-auto px-5 py-14 page-enter">
  <div class="text-[12px] font-medium text-primary mb-3 mono" data-i18n="kicker"></div>
  <h1 class="display text-[30px] md:text-[38px] font-medium mb-4" data-i18n="h1"></h1>
  <p class="text-[15px] text-base-content/70 leading-relaxed mb-12 max-w-[34rem]" data-i18n="intro"></p>

  <section class="mb-10">
    <h2 class="text-[18px] font-medium mb-3" data-i18n="s1h"></h2>
    <p class="text-[14px] text-base-content/70 leading-relaxed" data-i18n="s1b"></p>
  </section>

  <section class="mb-10">
    <h2 class="text-[18px] font-medium mb-3" data-i18n="s2h"></h2>
    <p class="text-[14px] text-base-content/70 leading-relaxed mb-3" data-i18n="s2b"></p>
    <div class="flex flex-wrap gap-2">
      <span class="text-[11px] font-medium px-2.5 py-1 rounded-full" style="background:#E1F5EE;color:#0F6E56" data-i18n="lvlStrong"></span>
      <span class="text-[11px] font-medium px-2.5 py-1 rounded-full" style="background:#E6F1FB;color:#0C447C" data-i18n="lvlMid"></span>
      <span class="text-[11px] font-medium px-2.5 py-1 rounded-full" style="background:#FAEEDA;color:#854F0B" data-i18n="lvlWeak"></span>
    </div>
  </section>

  <section class="mb-10">
    <h2 class="text-[18px] font-medium mb-3" data-i18n="s3h"></h2>
    <div class="bg-base-100 border border-base-300 rounded-xl p-5 space-y-3">
      <div class="flex items-start gap-3">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" class="flex-shrink-0 mt-0.5"><path d="M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6l8-4z" stroke="#1A6640" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" stroke="#1A6640" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <p class="text-[13.5px] text-base-content/75 leading-relaxed" data-i18n="priv1"></p>
      </div>
      <div class="flex items-start gap-3">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" class="flex-shrink-0 mt-0.5"><path d="M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6l8-4z" stroke="#1A6640" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" stroke="#1A6640" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <p class="text-[13.5px] text-base-content/75 leading-relaxed" data-i18n="priv2"></p>
      </div>
    </div>
  </section>

  <section class="mb-12">
    <h2 class="text-[18px] font-medium mb-3" data-i18n="s4h"></h2>
    <p class="text-[14px] text-base-content/70 leading-relaxed" data-i18n="s4b"></p>
  </section>

  <div class="bg-secondary text-primary-content rounded-2xl p-6 text-center">
    <p class="text-[15px] font-medium mb-4" data-i18n="ctaLine"></p>
    <a href="/app.html" class="btn bg-base-100 text-primary hover:bg-base-200 border-0 normal-case rounded-xl" data-i18n="ctaBtn"></a>
  </div>

  <p class="text-[11px] text-base-content/45 leading-relaxed mt-8" data-i18n="disc"></p>
</main>

<script>
const I18N = {
  ko: {
    navHome: '홈', navOpen: '증례 분석',
    kicker: '소개 · 방법론',
    h1: '어떻게 작동하고, 무엇을 저장하는가.',
    intro: 'DermCase는 진단 도구가 아니라 문헌 검토를 돕는 도구입니다. 의사의 판단을 대체하지 않으며, 의사가 더 빠르고 근거 있게 결정하도록 돕습니다.',
    s1h: '분석 방식',
    s1b: '증례 사진과 환자 정보를 입력하면, 모델이 형태학적 소견과 맥락을 바탕으로 유력 진단을 도출합니다. 그런 다음 그 진단에 맞춰 최신 published 문헌을 검색하고, 증례에 직접 적용 가능한 근거를 추려 구조화된 브리프로 정리합니다. 경쟁하는 치료 경로가 있을 때는 옵션을 나란히 비교해 제시합니다.',
    s2h: '문헌은 어떻게 선정되는가',
    s2b: '모델이 진단에 맞춘 검색어를 구성해 현재 문헌을 검색하고, 각 문헌의 근거 수준을 분류합니다. 근거 수준은 다음과 같이 색으로 표시됩니다. 표시된 근거 수준은 모델의 판단이므로, 항상 원문과 현재 가이드라인에 대조해 확인하십시오.',
    lvlStrong: '가이드라인 · 메타분석 · RCT', lvlMid: '코호트 · 리뷰', lvlWeak: '증례 보고',
    s3h: '개인정보 및 데이터',
    priv1: '증례 사진은 분석을 위해 처리될 뿐, 서버에 저장되지 않습니다.',
    priv2: '저장하는 증례는 이 기기의 브라우저에만 보관되며, 서버로 전송되지 않습니다. 언제든 삭제할 수 있습니다.',
    s4h: '한계',
    s4b: '검색과 근거 분류는 모델의 판단에 의존하며, 검증된 학술 데이터베이스 조회가 아닙니다. 결과가 부정확하거나 불완전할 수 있습니다. 모든 결과는 임상적 판단으로 검증되어야 하며, 환자별 요인을 반영해야 합니다.',
    ctaLine: '실제 증례로 직접 확인해 보세요.', ctaBtn: '증례 분석 시작',
    disc: '임상 의사결정 지원 목적으로만 사용 — 의사 판단을 대체하지 않습니다.',
  },
  en: {
    navHome: 'Home', navOpen: 'Open app',
    kicker: 'About · Methodology',
    h1: 'How it works, and what it stores.',
    intro: 'DermCase is a literature tool, not a diagnostic one. It does not replace physician judgment — it helps you reach a faster, better-evidenced decision.',
    s1h: 'How the analysis works',
    s1b: 'From the case photo and patient context, the model identifies a likely diagnosis based on the visible morphology and the clinical details. It then searches current published literature anchored to that diagnosis, selects references directly applicable to the case, and organizes them into a structured brief. When competing treatment paths exist, it presents the options side by side.',
    s2h: 'How references are sourced',
    s2b: 'The model constructs diagnosis-anchored search queries, searches current literature, and classifies each reference by its evidence level, shown by color below. The evidence level is the model\u2019s own judgment — always verify against the original source and current guidelines.',
    lvlStrong: 'Guideline · Meta-analysis · RCT', lvlMid: 'Cohort · Review', lvlWeak: 'Case report',
    s3h: 'Privacy & data',
    priv1: 'Case photos are processed for analysis and are never stored on our servers.',
    priv2: 'Cases you save are kept only in this device\u2019s browser and are never sent to a server. You can delete them at any time.',
    s4h: 'Limitations',
    s4b: 'Search and evidence classification rely on the model\u2019s judgment, not a verified academic database lookup. Results can be inaccurate or incomplete. Every output should be validated with clinical judgment and weighed against patient-specific factors.',
    ctaLine: 'See for yourself on a real case.', ctaBtn: 'Open the app',
    disc: 'For clinical decision support only — not a substitute for physician judgment.',
  }
};
let lang = (navigator.language || '').toLowerCase().startsWith('en') ? 'en' : 'ko';
function t(k){ return I18N[lang][k] || I18N.en[k] || k; }
function applyI18n(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
  document.getElementById('langBtn').textContent = lang === 'ko' ? 'EN' : '한국어';
}
document.getElementById('langBtn').addEventListener('click', () => { lang = lang === 'ko' ? 'en' : 'ko'; applyI18n(); });
applyI18n();
</script>
</body>
</html>
