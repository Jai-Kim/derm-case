<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About — DermCase Assistant</title>
<meta name="description" content="DermCase가 어떻게 작동하고, 무엇을 저장하지 않는가. 투명하게 설계된 임상 문헌 도구.">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#14130D; --ink-2:#5C5A50; --ink-3:#8A887E;
  --paper:#F4F2EC; --paper-2:#FBFAF6;
  --forest:#0A2E1E; --forest-2:#0F3D29; --forest-line:rgba(180,220,196,.14);
  --green:#1A6640; --green-2:#21814F; --sage:#4E9E73; --mist:#CFE3D7;
  --border:#E3E0D8; --border-2:#D2CEC3;
  --strong:#0F6E56; --strong-bg:#E1F5EE; --mid:#2A5C95; --mid-bg:#E7EFFA; --weak:#9A5B12; --weak-bg:#F7ECDA;
  --r:16px; --r-sm:10px; --maxw:1100px;
}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.mono{font-family:'DM Mono',monospace}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
.display{letter-spacing:-.028em;line-height:1.03;font-weight:600}
h1,h2,h3{font-weight:600;letter-spacing:-.02em}
a{color:inherit;text-decoration:none}svg{display:block}

#prog{position:fixed;top:0;left:0;height:2.5px;width:0;background:linear-gradient(90deg,var(--sage),var(--green));z-index:60;transition:width .08s linear}

nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);background:rgba(244,242,236,.72);border-bottom:1px solid var(--border)}
nav.on-dark{background:rgba(10,46,30,.55);border-bottom-color:var(--forest-line)}
.navin{height:60px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--green);display:grid;place-items:center;transition:transform .3s,background .3s}
.brand:hover .logo{transform:rotate(8deg)}
nav.on-dark .brand{color:#fff}nav.on-dark .logo{background:var(--sage)}
.navlinks{display:flex;align-items:center;gap:4px;font-size:13.5px}
.navlinks a,.navlinks button{padding:7px 13px;border-radius:9px;color:var(--ink-2);background:none;border:none;font:inherit;font-size:13.5px;cursor:pointer;transition:background .15s,color .15s}
.navlinks a:hover,.navlinks button:hover{color:var(--ink);background:rgba(0,0,0,.05)}
nav.on-dark .navlinks a,nav.on-dark .navlinks button{color:rgba(255,255,255,.66)}
nav.on-dark .navlinks a:hover,nav.on-dark .navlinks button:hover{color:#fff;background:rgba(255,255,255,.1)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 17px;border-radius:11px;font-weight:500;font-size:14px;cursor:pointer;border:none;transition:transform .12s,background .15s}
.btn:active{transform:scale(.98)}
.btn-pri{background:var(--green);color:#fff}.btn-pri:hover{background:var(--green-2)}
.btn-light{background:var(--paper-2);color:var(--green)}.btn-light:hover{background:#fff}
.btn-ghost{background:transparent}
.navlinks .btn-pri{background:var(--sage);color:var(--forest);font-weight:600;padding:8px 15px;font-size:13.5px}.navlinks .btn-pri:hover{background:#5fb085;color:var(--forest)}

section{position:relative}
.dark{background:var(--forest);color:#fff}
.dark h1,.dark h2,.dark h3{color:#fff}
.eyebrow{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--green);display:inline-flex;align-items:center;gap:9px}
.dark .eyebrow{color:var(--sage)}
.eyebrow::before{content:"";width:22px;height:1px;background:currentColor;opacity:.6}
.grid-tex{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(var(--forest-line) 1px,transparent 1px),linear-gradient(90deg,var(--forest-line) 1px,transparent 1px);background-size:30px 30px;-webkit-mask-image:radial-gradient(ellipse 75% 70% at 50% 35%,#000 25%,transparent 78%);mask-image:radial-gradient(ellipse 75% 70% at 50% 35%,#000 25%,transparent 78%)}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rise{opacity:0;animation:rise .8s cubic-bezier(.22,1,.36,1) forwards}
.d1{animation-delay:.05s}.d2{animation-delay:.16s}.d3{animation-delay:.28s}.d4{animation-delay:.4s}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .8s cubic-bezier(.22,1,.36,1),transform .8s cubic-bezier(.22,1,.36,1)}
.reveal.in{opacity:1;transform:none}

/* HERO */
.hero{padding:84px 0 96px;overflow:hidden;text-align:center}
.hero h1{font-size:clamp(34px,5.6vw,60px);margin:20px 0 20px;color:#fff;max-width:16ch;margin-left:auto;margin-right:auto}
.hero p.sub{font-size:clamp(15px,1.7vw,17px);color:rgba(255,255,255,.72);max-width:34rem;margin:0 auto 30px;line-height:1.62}
.hero .cta-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.orbit{position:absolute;left:50%;top:50%;width:520px;height:520px;transform:translate(-50%,-50%);opacity:.4;pointer-events:none}
.orbit .ring{transform-origin:center;animation:spin 60s linear infinite}
.orbit .ring.r2{animation-duration:44s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.scrollcue{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.4);display:flex;flex-direction:column;align-items:center;gap:7px}
.scrollcue .ln{width:1px;height:30px;background:linear-gradient(rgba(255,255,255,.4),transparent);animation:cue 1.8s ease-in-out infinite}
@keyframes cue{0%,100%{transform:scaleY(.5);opacity:.3;transform-origin:top}50%{transform:scaleY(1);opacity:.8;transform-origin:top}}

/* PIPELINE (pinned, experimental centerpiece) */
.pipe-sec{height:340vh;position:relative}
.pipe-sticky{position:sticky;top:0;height:100vh;display:flex;align-items:center;overflow:hidden}
.pipe-inner{width:100%}
.pipe-head{text-align:center;margin-bottom:46px}
.pipe-head h2{font-size:clamp(26px,3.6vw,40px);margin-top:14px}
.nodes{display:flex;align-items:center;justify-content:center;gap:0;max-width:760px;margin:0 auto 40px}
.node{display:flex;flex-direction:column;align-items:center;gap:11px;flex-shrink:0;width:120px}
.node .dot{width:54px;height:54px;border-radius:16px;border:1.5px solid var(--forest-line);background:rgba(255,255,255,.04);display:grid;place-items:center;transition:all .45s cubic-bezier(.22,1,.36,1)}
.node.on .dot{border-color:var(--sage);background:rgba(78,158,115,.16);box-shadow:0 0 0 6px rgba(78,158,115,.08)}
.node .dot svg{opacity:.5;transition:opacity .45s}
.node.on .dot svg{opacity:1}
.node .lbl{font-size:12px;color:rgba(255,255,255,.5);text-align:center;transition:color .45s;font-weight:500}
.node.on .lbl{color:#fff}
.conn{height:2px;flex:1;min-width:24px;max-width:80px;background:var(--forest-line);position:relative;overflow:hidden;margin-bottom:33px}
.conn::after{content:"";position:absolute;inset:0;width:0;background:linear-gradient(90deg,var(--sage),var(--green));transition:width .5s ease}
.conn.fill::after{width:100%}
.stage-detail{max-width:560px;margin:0 auto;min-height:120px;position:relative}
.stage{position:absolute;inset:0;opacity:0;transform:translateY(10px);transition:opacity .45s,transform .45s;text-align:center;pointer-events:none}
.stage.on{opacity:1;transform:none;pointer-events:auto}
.stage .sn{font-family:'DM Mono',monospace;font-size:12px;color:var(--sage);letter-spacing:.08em}
.stage h3{font-size:21px;margin:8px 0 8px;color:#fff}
.stage p{font-size:14.5px;color:rgba(255,255,255,.68);line-height:1.62;max-width:30rem;margin:0 auto}

/* generic content sections */
.sec{padding:100px 0}
.sec-head{max-width:40rem;margin-bottom:46px}
.sec-head h2{font-size:clamp(26px,3.4vw,38px);margin:14px 0 16px}
.sec-head p{font-size:16px;color:var(--ink-2);line-height:1.62}
.dark .sec-head p{color:rgba(255,255,255,.66)}

/* evidence tiers */
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tier{background:var(--paper-2);border:1px solid var(--border);border-radius:var(--r);padding:24px;transition:transform .25s,box-shadow .25s}
.tier:hover{transform:translateY(-4px);box-shadow:0 18px 40px -22px rgba(10,46,30,.25)}
.evp{display:inline-block;font-size:11px;font-weight:600;padding:3px 11px;border-radius:99px;margin-bottom:13px}
.evp.s{background:var(--strong-bg);color:var(--strong)}.evp.m{background:var(--mid-bg);color:var(--mid)}.evp.w{background:var(--weak-bg);color:var(--weak)}
.tier h3{font-size:15px;margin-bottom:6px}
.tier p{font-size:13px;color:var(--ink-2);line-height:1.55}
.tier .ex{font-family:'DM Mono',monospace;font-size:11.5px;color:var(--ink-3);margin-top:9px}
.tier-note{margin-top:20px;font-size:13px;color:var(--ink-3);line-height:1.6;max-width:42rem}

/* privacy experiential */
.priv-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:8px}
.priv-card{border:1px solid var(--forest-line);border-radius:var(--r);padding:28px 24px;background:rgba(255,255,255,.04);position:relative;overflow:hidden}
.priv-card .ic{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;margin-bottom:16px}
.priv-card h3{font-size:16px;color:#fff;margin-bottom:7px}
.priv-card p{font-size:13.5px;color:rgba(255,255,255,.66);line-height:1.6}
.priv-photo .ic{background:rgba(154,91,18,.18)}
.priv-photo .ghost{transition:opacity 1s ease,filter 1s ease;opacity:1}
.priv-card.in .priv-photo-ghost,.priv-photo.diss .ghost{opacity:.12;filter:blur(3px)}
.priv-keep .ic{background:rgba(78,158,115,.18)}
.tag{display:inline-block;font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.05em;padding:3px 9px;border-radius:99px;margin-top:13px}
.tag.gone{background:rgba(154,91,18,.2);color:#E8C99A}
.tag.kept{background:rgba(78,158,115,.2);color:var(--mist)}
@keyframes dissolve{0%{opacity:1;filter:blur(0)}60%{opacity:1}100%{opacity:.1;filter:blur(4px)}}
.diss-target{animation:none}
.priv-card.in .diss-target{animation:dissolve 1.6s ease forwards .3s}

/* limitations */
.lims{display:flex;flex-direction:column;gap:2px;max-width:46rem}
.lim{display:flex;gap:15px;padding:18px 0;border-top:1px solid var(--border)}
.lim:first-child{border-top:none}
.lim .n{font-family:'DM Mono',monospace;font-size:12px;color:var(--green);padding-top:2px;flex-shrink:0}
.lim h3{font-size:16px;margin-bottom:4px}
.lim p{font-size:14px;color:var(--ink-2);line-height:1.6}

/* stats strip */
.stats{display:flex;gap:48px;flex-wrap:wrap;margin-top:8px}
.stat .big{font-family:'DM Mono',monospace;font-size:40px;font-weight:500;letter-spacing:-.02em;color:var(--green)}
.dark .stat .big{color:var(--sage)}
.stat .lbl{font-size:13px;color:var(--ink-2);margin-top:2px}
.dark .stat .lbl{color:rgba(255,255,255,.6)}

/* finale */
.finale{padding:104px 0}
.finale-card{position:relative;background:linear-gradient(135deg,var(--green),var(--forest-2));border-radius:30px;padding:76px 32px;text-align:center;overflow:hidden;color:#fff}
.finale-card h2{font-size:clamp(28px,4vw,46px);color:#fff;margin-bottom:14px}
.finale-card p{font-size:16px;color:rgba(255,255,255,.78);max-width:30rem;margin:0 auto 30px}

footer{border-top:1px solid var(--border);padding:34px 0}
.footin{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.footin .disc{font-size:11.5px;color:var(--ink-3);line-height:1.6;max-width:38rem}

@media (max-width:820px){
  .tiers,.priv-grid{grid-template-columns:1fr}
  .pipe-sec{height:auto}.pipe-sticky{position:static;height:auto;padding:80px 0}
  .nodes{flex-wrap:wrap;gap:14px;justify-content:center}.conn{display:none}.node{width:84px}
  .stage-detail{position:static;min-height:0;margin-top:24px}.stage{position:static;opacity:1;transform:none;margin-bottom:18px}
  .orbit{display:none}
  .navlinks a.hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .rise{opacity:1;animation:none}.reveal{opacity:1;transform:none;transition:none}
  .ring,.ln{animation:none!important}.diss-target{animation:none!important;opacity:1}
  .pipe-sec{height:auto}.pipe-sticky{position:static;height:auto;padding:80px 0}
  .stage{position:static;opacity:1;transform:none;margin-bottom:18px}.conn{display:none}
}
</style>
</head>
<body>
<div id="prog"></div>

<nav id="nav" class="on-dark">
  <div class="wrap navin">
    <a href="/" class="brand"><span class="logo"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M8 2.3L13.2 5v6L8 13.7 2.8 11V5L8 2.3z" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/></svg></span>DermCase</a>
    <div class="navlinks">
      <a href="/" class="hide-sm" data-i18n="navHome"></a>
      <button id="langBtn" class="mono" style="font-size:12px">EN</button>
      <a href="/app" class="btn btn-pri" data-i18n="navOpen"></a>
    </div>
  </div>
</nav>

<!-- HERO -->
<section class="dark hero" id="hero">
  <div class="grid-tex"></div>
  <svg class="orbit" viewBox="0 0 200 200" fill="none">
    <g class="ring r1"><circle cx="100" cy="100" r="86" stroke="#4E9E73" stroke-width=".8" stroke-dasharray="2 8" opacity=".7"/></g>
    <g class="ring r2"><circle cx="100" cy="100" r="62" stroke="#CFE3D7" stroke-width=".8" opacity=".4"/></g>
    <g class="ring r1"><circle cx="100" cy="100" r="38" stroke="#4E9E73" stroke-width=".8" opacity=".5"/></g>
  </svg>
  <div class="wrap" style="position:relative">
    <span class="eyebrow rise d1" data-i18n="eyebrow"></span>
    <h1 class="rise d2 display" data-i18n="heroH1"></h1>
    <p class="sub rise d3" data-i18n="heroSub"></p>
    <div class="cta-row rise d4">
      <a href="#pipeline" class="btn btn-light" data-i18n="ctaSee"></a>
      <a href="/app" class="btn btn-ghost" style="color:rgba(255,255,255,.72)" data-i18n="ctaOpen"></a>
    </div>
  </div>
  <div class="scrollcue"><span data-i18n="scrollCue"></span><span class="ln"></span></div>
</section>

<!-- PIPELINE -->
<section class="dark pipe-sec" id="pipeline">
  <div class="grid-tex"></div>
  <div class="pipe-sticky"><div class="pipe-inner wrap">
    <div class="pipe-head">
      <span class="eyebrow" data-i18n="pipeEyebrow"></span>
      <h2 class="display" data-i18n="pipeH2"></h2>
    </div>
    <div class="nodes" id="nodes">
      <div class="node" data-n="1"><div class="dot"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="14" rx="2.5" stroke="#CFE3D7" stroke-width="1.5"/><circle cx="9" cy="12" r="2" stroke="#CFE3D7" stroke-width="1.4"/><path d="M3 17l5-3 4 2.5 4-4 5 4" stroke="#CFE3D7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="lbl" data-i18n="n1"></div></div>
      <div class="conn" data-c="1"></div>
      <div class="node" data-n="2"><div class="dot"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#CFE3D7" stroke-width="1.5"/><path d="M16 16l4 4" stroke="#CFE3D7" stroke-width="1.5" stroke-linecap="round"/></svg></div><div class="lbl" data-i18n="n2"></div></div>
      <div class="conn" data-c="2"></div>
      <div class="node" data-n="3"><div class="dot"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M5 4h11l3 3v13H5z" stroke="#CFE3D7" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 11h8M8 14h8M8 8h4" stroke="#CFE3D7" stroke-width="1.4" stroke-linecap="round"/></svg></div><div class="lbl" data-i18n="n3"></div></div>
      <div class="conn" data-c="3"></div>
      <div class="node" data-n="4"><div class="dot"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="4" y="3" width="16" height="18" rx="2.5" stroke="#CFE3D7" stroke-width="1.5"/><path d="M8 8h8M8 12h8M8 16h5" stroke="#CFE3D7" stroke-width="1.4" stroke-linecap="round"/></svg></div><div class="lbl" data-i18n="n4"></div></div>
    </div>
    <div class="stage-detail" id="stages">
      <div class="stage" data-s="1"><div class="sn">01</div><h3 data-i18n="s1h"></h3><p data-i18n="s1p"></p></div>
      <div class="stage" data-s="2"><div class="sn">02</div><h3 data-i18n="s2h"></h3><p data-i18n="s2p"></p></div>
      <div class="stage" data-s="3"><div class="sn">03</div><h3 data-i18n="s3h"></h3><p data-i18n="s3p"></p></div>
      <div class="stage" data-s="4"><div class="sn">04</div><h3 data-i18n="s4h"></h3><p data-i18n="s4p"></p></div>
    </div>
  </div></div>
</section>

<!-- EVIDENCE -->
<section class="sec" id="evidence">
  <div class="wrap">
    <div class="sec-head reveal">
      <span class="eyebrow" data-i18n="evEyebrow"></span>
      <h2 class="display" data-i18n="evH2"></h2>
      <p data-i18n="evP"></p>
    </div>
    <div class="tiers">
      <div class="tier reveal"><span class="evp s" data-i18n="evStrong"></span><h3 data-i18n="evStrongH"></h3><p data-i18n="evStrongP"></p><div class="ex" data-i18n="evStrongEx"></div></div>
      <div class="tier reveal" style="transition-delay:.08s"><span class="evp m" data-i18n="evMid"></span><h3 data-i18n="evMidH"></h3><p data-i18n="evMidP"></p><div class="ex" data-i18n="evMidEx"></div></div>
      <div class="tier reveal" style="transition-delay:.16s"><span class="evp w" data-i18n="evWeak"></span><h3 data-i18n="evWeakH"></h3><p data-i18n="evWeakP"></p><div class="ex" data-i18n="evWeakEx"></div></div>
    </div>
    <p class="tier-note reveal" data-i18n="evNote"></p>
  </div>
</section>

<!-- PRIVACY -->
<section class="dark sec" id="privacy">
  <div class="grid-tex"></div>
  <div class="wrap">
    <div class="sec-head reveal">
      <span class="eyebrow" data-i18n="prEyebrow"></span>
      <h2 class="display" data-i18n="prH2"></h2>
      <p data-i18n="prP"></p>
    </div>
    <div class="priv-grid">
      <div class="priv-card priv-photo reveal">
        <div class="ic diss-target"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="15" rx="2.5" stroke="#E8C99A" stroke-width="1.6"/><circle cx="9" cy="11" r="2.2" stroke="#E8C99A" stroke-width="1.5"/><path d="M3 17l5-3 4 2.5 4-4 5 4" stroke="#E8C99A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <h3 data-i18n="prPhotoH"></h3>
        <p data-i18n="prPhotoP"></p>
        <span class="tag gone" data-i18n="prPhotoTag"></span>
      </div>
      <div class="priv-card priv-keep reveal" style="transition-delay:.1s">
        <div class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 3l8 3.5v5C20 17 16.5 20 12 21.5 7.5 20 4 17 4 11.5v-5L12 3z" stroke="#CFE3D7" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" stroke="#CFE3D7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <h3 data-i18n="prKeepH"></h3>
        <p data-i18n="prKeepP"></p>
        <span class="tag kept" data-i18n="prKeepTag"></span>
      </div>
    </div>
    <div class="stats reveal" style="margin-top:40px">
      <div class="stat"><div class="big cup" data-i18n="prStat1n"></div><div class="lbl" data-i18n="prStat1l"></div></div>
      <div class="stat"><div class="big" data-i18n="prStat2n"></div><div class="lbl" data-i18n="prStat2l"></div></div>
    </div>
  </div>
</section>

<!-- LIMITATIONS -->
<section class="sec" id="limits">
  <div class="wrap">
    <div class="sec-head reveal">
      <span class="eyebrow" data-i18n="liEyebrow"></span>
      <h2 class="display" data-i18n="liH2"></h2>
      <p data-i18n="liP"></p>
    </div>
    <div class="lims">
      <div class="lim reveal"><span class="n">01</span><div><h3 data-i18n="li1h"></h3><p data-i18n="li1p"></p></div></div>

let lang=(navigator.language||'').toLowerCase().startsWith('en')?'en':'ko';
function t(k){return I18N[lang][k]||I18N.en[k]||k;}
function applyI18n(){document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(function(el){el.textContent=t(el.getAttribute('data-i18n'));});document.getElementById('langBtn').textContent=lang==='ko'?'EN':'한국어';}

var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var prog=document.getElementById('prog');
function onScroll(){
  var h=document.documentElement.scrollHeight-window.innerHeight;
  prog.style.width=(h>0?(window.scrollY/h)*100:0)+'%';
  var nav=document.getElementById('nav'),y=window.scrollY+60,dark=false;
  document.querySelectorAll('section.dark').forEach(function(s){if(y>=s.offsetTop&&y<s.offsetTop+s.offsetHeight)dark=true;});
  nav.classList.toggle('on-dark',dark);
}
window.addEventListener('scroll',onScroll,{passive:true});onScroll();

var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{threshold:.14,rootMargin:'0px 0px -50px 0px'});
document.querySelectorAll('.reveal').forEach(function(el){io.observe(el);});

// count-up
function countUp(el){var s=(el.textContent||'').trim();var m=s.match(/^(\d+)(.*)$/);if(!m){return;}if(reduce){el.textContent=s;return;}var end=parseInt(m[1],10),suf=m[2],t0=null;function step(ts){if(!t0)t0=ts;var p=Math.min((ts-t0)/900,1);el.textContent=Math.round((1-Math.pow(1-p,3))*end)+suf;if(p<1)requestAnimationFrame(step);}requestAnimationFrame(step);}
var cio=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){countUp(e.target);cio.unobserve(e.target);}});},{threshold:.7});
document.querySelectorAll('.cup').forEach(function(el){cio.observe(el);});

// pinned pipeline: scroll progress -> active stage 1..4
var pipe=document.getElementById('pipeline'),nodes=document.querySelectorAll('#nodes .node'),conns=document.querySelectorAll('#nodes .conn'),stages=document.querySelectorAll('#stages .stage');
function pipeline(){
  if(!pipe)return;
  var rect=pipe.getBoundingClientRect(),total=pipe.offsetHeight-window.innerHeight;
  var passed=Math.min(Math.max(-rect.top,0),total),frac=total>0?passed/total:0;
  var stage=Math.min(4,Math.floor(frac*4)+1);
  nodes.forEach(function(n){n.classList.toggle('on',parseInt(n.getAttribute('data-n'),10)<=stage);});
  conns.forEach(function(c){c.classList.toggle('fill',parseInt(c.getAttribute('data-c'),10)<stage);});
  stages.forEach(function(s){s.classList.toggle('on',parseInt(s.getAttribute('data-s'),10)===stage);});
}
window.addEventListener('scroll',pipeline,{passive:true});pipeline();
if(reduce){stages.forEach(function(s){s.classList.add('on');});nodes.forEach(function(n){n.classList.add('on');});}
